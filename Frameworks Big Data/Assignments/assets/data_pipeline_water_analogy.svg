<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="100%" height="auto" style="background:transparent; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow-water-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-water-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-water-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="30" text-anchor="middle" fill="#000000" font-size="20" font-weight="bold">The Water Purification Mental Model of Big Data Pipelines</text>
  <text x="480" y="52" text-anchor="middle" fill="#475569" font-size="13" font-weight="500">Visualizing Ingestion, Transformation, Quality Gates &amp; Consumption</text>

  <!-- Stage 1: The Raw River (Ingestion) -->
  <g transform="translate(25, 80)">
    <rect width="200" height="295" rx="12" fill="#f0f9ff" stroke="#38bdf8" stroke-width="2"/>
    <rect width="200" height="38" rx="12" fill="#e0f2fe"/>
    <text x="100" y="24" text-anchor="middle" fill="#0369a1" font-size="13" font-weight="bold">1. Raw River (Sources)</text>

    <!-- River Icon Box -->
    <rect x="15" y="52" width="170" height="70" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
    <text x="25" y="74" fill="#0284c7" font-size="12" font-weight="bold">&#127754; Natural Stream</text>
    <text x="25" y="93" fill="#000000" font-size="10">&#8226; Kafka events &amp; CDC logs</text>
    <text x="25" y="108" fill="#475569" font-size="9">Continuous, muddy, unverified</text>

    <!-- Staging / Bronze -->
    <rect x="15" y="132" width="170" height="70" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
    <text x="25" y="154" fill="#0f172a" font-size="11" font-weight="bold">Bronze / Intake Basin</text>
    <text x="25" y="173" fill="#000000" font-size="10">&#8226; Raw storage (S3 / HDFS)</text>
    <text x="25" y="188" fill="#475569" font-size="9">Exact copy of upstream stream</text>

    <!-- Hazard Tag -->
    <rect x="15" y="212" width="170" height="60" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="25" y="233" fill="#c2410c" font-size="10" font-weight="bold">&#9888; Contamination Risk:</text>
    <text x="25" y="252" fill="#475569" font-size="9">Contains nulls, typos &amp; corrupt rows</text>
  </g>

  <!-- Flow Arrow 1 to 2 -->
  <line x1="225" y1="210" x2="265" y2="210" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow-water-blue)"/>

  <!-- Stage 2: Treatment Plant (Compute / Spark) -->
  <g transform="translate(270, 80)">
    <rect width="215" height="295" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect width="215" height="38" rx="12" fill="#dbeafe"/>
    <text x="107" y="24" text-anchor="middle" fill="#1d4ed8" font-size="13" font-weight="bold">2. Treatment Plant (Spark)</text>

    <!-- Processing Units -->
    <rect x="15" y="52" width="185" height="80" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="25" y="74" fill="#1e40af" font-size="11" font-weight="bold">&#9881; Filtration &amp; Enrichment</text>
    <text x="25" y="93" fill="#000000" font-size="10">&#8226; Parsing &amp; deduplication</text>
    <text x="25" y="108" fill="#000000" font-size="10">&#8226; Joining master dimensions</text>
    <text x="25" y="122" fill="#475569" font-size="9">(Spark transformations / dbt)</text>

    <!-- Sensor Check -->
    <rect x="15" y="142" width="185" height="130" rx="8" fill="#fdf4ff" stroke="#f0abfc" stroke-width="1.5"/>
    <text x="25" y="165" fill="#a21caf" font-size="11" font-weight="bold">&#128300; Lab Quality Testing</text>
    <text x="25" y="184" fill="#000000" font-size="10">&#8226; Check turbidity (Schema)</text>
    <text x="25" y="200" fill="#000000" font-size="10">&#8226; Check toxins (Null %)</text>
    <text x="25" y="217" fill="#000000" font-size="10">&#8226; Automated assertions</text>
    <text x="25" y="235" fill="#16a34a" font-size="9" font-weight="bold">&#10004; Passed &#8594; Main Pipeline</text>
    <text x="25" y="253" fill="#dc2626" font-size="9" font-weight="bold">&#10008; Tainted &#8594; Emergency Valve</text>
  </g>

  <!-- Flow Split Arrows -->
  <line x1="485" y1="180" x2="525" y2="150" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-water-green)"/>
  <line x1="485" y1="260" x2="525" y2="290" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-water-red)"/>

  <!-- Stage 3A: Clean Reservoir (Lakehouse) -->
  <g transform="translate(530, 80)">
    <rect width="210" height="135" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
    <rect width="210" height="34" rx="10" fill="#dcfce7"/>
    <text x="105" y="22" text-anchor="middle" fill="#166534" font-size="12" font-weight="bold">3A. Clean Reservoir (Gold)</text>

    <text x="15" y="55" fill="#166534" font-size="11" font-weight="bold">ACID Certified Water</text>
    <text x="15" y="73" fill="#000000" font-size="10">&#8226; Delta Lake / Apache Iceberg</text>
    <text x="15" y="90" fill="#000000" font-size="10">&#8226; Snapshot isolation &amp; WAP</text>
    <text x="15" y="107" fill="#16a34a" font-size="10" font-weight="600">&#10004; 100% Pure &amp; Trustworthy</text>
  </g>

  <!-- Stage 3B: Emergency Isolation (DLQ / Quarantine) -->
  <g transform="translate(530, 230)">
    <rect width="210" height="145" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
    <rect width="210" height="34" rx="10" fill="#fee2e2"/>
    <text x="105" y="22" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="bold">3B. Quarantine Waste Basin</text>

    <text x="15" y="55" fill="#991b1b" font-size="11" font-weight="bold">Dead-Letter Isolation (DLQ)</text>
    <text x="15" y="73" fill="#000000" font-size="10">&#8226; Circuit breaker shut valve</text>
    <text x="15" y="90" fill="#000000" font-size="10">&#8226; Contaminated batches isolated</text>
    <text x="15" y="107" fill="#475569" font-size="9">&#8226; PagerDuty alert to on-call engr</text>
    <text x="15" y="125" fill="#dc2626" font-size="9" font-weight="bold">&#9888; Zero city contamination</text>
  </g>

  <!-- Flow to Consumers -->
  <line x1="740" y1="145" x2="775" y2="145" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-water-green)"/>

  <!-- Stage 4: Clean City Consumption -->
  <g transform="translate(780, 80)">
    <rect width="155" height="295" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <rect width="155" height="38" rx="12" fill="#f1f5f9"/>
    <text x="77" y="24" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">4. Safe Taps (Users)</text>

    <!-- Tap 1 -->
    <rect x="12" y="52" width="131" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="20" y="74" fill="#0f172a" font-size="11" font-weight="bold">&#128202; Executive BI</text>
    <text x="20" y="92" fill="#475569" font-size="9">Tableau / PowerBI</text>
    <text x="20" y="106" fill="#16a34a" font-size="9" font-weight="600">Accurate decisions</text>

    <!-- Tap 2 -->
    <rect x="12" y="127" width="131" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="20" y="149" fill="#0f172a" font-size="11" font-weight="bold">&#129302; ML Predictions</text>
    <text x="20" y="167" fill="#475569" font-size="9">Recommendation engine</text>
    <text x="20" y="181" fill="#16a34a" font-size="9" font-weight="600">Unbiased models</text>

    <!-- Tap 3 -->
    <rect x="12" y="202" width="131" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="20" y="224" fill="#0f172a" font-size="11" font-weight="bold">&#128179; Financial Audit</text>
    <text x="20" y="242" fill="#475569" font-size="9">Billing &amp; tax ledgers</text>
    <text x="20" y="256" fill="#16a34a" font-size="9" font-weight="600">Zero duplicate errors</text>
  </g>
</svg>

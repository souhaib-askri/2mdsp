<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="100%" height="auto" style="background:transparent; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow-blue3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-purple3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="30" text-anchor="middle" fill="#000000" font-size="20" font-weight="bold">Beyond Spark: Local Compute Fault Tolerance vs. End-to-End Pipeline Reliability</text>
  <text x="480" y="52" text-anchor="middle" fill="#475569" font-size="13" font-weight="500">Why in-engine RDD lineage is necessary but insufficient for enterprise production workflows</text>

  <!-- Box 1: Spark Local Boundary -->
  <g transform="translate(30, 80)">
    <rect width="425" height="305" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <rect width="425" height="38" rx="12" fill="#dbeafe"/>
    <text x="212" y="24" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">Inside Apache Spark: In-Memory Engine Scope</text>

    <!-- RDD Lineage Card -->
    <rect x="20" y="52" width="385" height="75" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="35" y="74" fill="#1d4ed8" font-size="12" font-weight="bold">Deterministic RDD Lineage (Graph of Transformations)</text>
    <text x="35" y="93" fill="#000000" font-size="11">&#8226; Worker crashes &#8594; Recompute lost partitions from parent RDD</text>
    <text x="35" y="111" fill="#059669" font-size="11" font-weight="600">&#10004; Excellent for infrastructure node failure tolerance</text>

    <!-- Spark Blindspots -->
    <rect x="20" y="137" width="385" height="135" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="35" y="160" fill="#b91c1c" font-size="12" font-weight="bold">Internal Blind Spots (Where Spark Cannot Recover)</text>
    <text x="35" y="180" fill="#000000" font-size="11">&#8226; <tspan font-weight="bold">Driver OOM</tspan>: Kills whole application; requires external supervisor</text>
    <text x="35" y="200" fill="#000000" font-size="11">&#8226; <tspan font-weight="bold">Silent Semantic Corruption</tspan>: Successfully processes bad nulls/logic</text>
    <text x="35" y="220" fill="#000000" font-size="11">&#8226; <tspan font-weight="bold">Schema Drift</tspan>: Source alters types; Spark batch fails deterministically</text>
    <text x="35" y="240" fill="#000000" font-size="11">&#8226; <tspan font-weight="bold">No Inter-System Context</tspan>: Unaware of Kafka offsets or BI staleness</text>
  </g>

  <!-- Connective Arrow in Center -->
  <line x1="465" y1="230" x2="495" y2="230" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow-purple3)"/>

  <!-- Box 2: End-to-End Production Pipeline -->
  <g transform="translate(505, 80)">
    <rect width="425" height="305" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <rect width="425" height="38" rx="12" fill="#e2e8f0"/>
    <text x="212" y="24" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="bold">Modern End-to-End Production Ecosystem</text>

    <!-- Upstream Dependencies -->
    <rect x="20" y="52" width="385" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="35" y="74" fill="#0f172a" font-size="12" font-weight="bold">1. Upstream &amp; Ingestion Layer (APIs / Kafka / CDC)</text>
    <text x="35" y="93" fill="#475569" font-size="11">&#8226; Network timeouts, stream backpressure, missing contract schemas</text>

    <!-- Orchestration & Validation -->
    <rect x="20" y="125" width="385" height="75" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="35" y="147" fill="#6d28d9" font-size="12" font-weight="bold">2. Orchestration &amp; Quality Gates (Airflow / Dagster / GX)</text>
    <text x="35" y="167" fill="#000000" font-size="11">&#8226; Global state management, container lifecycle, contract tests</text>
    <text x="35" y="184" fill="#000000" font-size="11">&#8226; Data Circuit Breakers to stop corrupted data from propagating</text>

    <!-- Downstream Consumers -->
    <rect x="20" y="208" width="385" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="35" y="230" fill="#0f172a" font-size="12" font-weight="bold">3. Serving &amp; Consumption (Iceberg Lakehouse / ML / BI)</text>
    <text x="35" y="250" fill="#475569" font-size="11">&#8226; ACID atomic snapshots, SLA tracking, OpenLineage observability</text>
  </g>
</svg>

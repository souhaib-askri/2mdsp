<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="100%" height="auto" style="background:transparent; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow-lineage-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-lineage-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-lineage-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="30" text-anchor="middle" fill="#000000" font-size="20" font-weight="bold">Column-Level Lineage &amp; Precise Root Cause Isolation</text>
  <text x="480" y="52" text-anchor="middle" fill="#475569" font-size="13" font-weight="500">Tracing an erroneous business metric directly to the faulty upstream column</text>

  <!-- SOURCE TABLES -->
  <g transform="translate(30, 80)">
    <!-- Table 1: raw_orders -->
    <rect width="210" height="135" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <rect width="210" height="30" rx="10" fill="#f1f5f9"/>
    <text x="105" y="20" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">Table: raw_orders</text>
    <text x="15" y="48" fill="#475569" font-size="10">&#8226; order_id (bigint)</text>
    <text x="15" y="66" fill="#1e40af" font-size="10" font-weight="bold">&#8226; amount_cents (int) [Source]</text>
    <text x="15" y="84" fill="#475569" font-size="10">&#8226; currency (varchar)</text>
    <text x="15" y="102" fill="#475569" font-size="10">&#8226; user_id (uuid)</text>

    <!-- Table 2: forex_rates (Root Cause) -->
    <g transform="translate(0, 150)">
      <rect width="210" height="135" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
      <rect width="210" height="30" rx="10" fill="#fee2e2"/>
      <text x="105" y="20" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="bold">Table: forex_rates</text>
      <text x="15" y="48" fill="#475569" font-size="10">&#8226; currency_code (varchar)</text>
      <text x="15" y="68" fill="#dc2626" font-size="10" font-weight="bold">&#9888; rate_to_usd (double) [BUG: NULL]</text>
      <text x="15" y="86" fill="#475569" font-size="10">&#8226; fetched_at (timestamp)</text>
      <rect x="10" y="98" width="190" height="26" rx="4" fill="#fee2e2"/>
      <text x="105" y="115" text-anchor="middle" fill="#b91c1c" font-size="9" font-weight="bold">&#9664; ROOT CAUSE ORIGIN</text>
    </g>
  </g>

  <!-- Connectors from Source Columns to Job -->
  <line x1="240" y1="145" x2="300" y2="185" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-lineage-blue)"/>
  <line x1="240" y1="298" x2="300" y2="245" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-lineage-red)"/>

  <!-- TRANSFORMATION JOB (Spark) -->
  <g transform="translate(305, 120)">
    <rect width="245" height="195" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <rect width="245" height="34" rx="12" fill="#ede9fe"/>
    <text x="122" y="22" text-anchor="middle" fill="#6d28d9" font-size="12" font-weight="bold">Spark Transformation Job</text>

    <rect x="15" y="48" width="215" height="70" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="25" y="68" fill="#5b21b6" font-size="10" font-weight="bold">Column Expression Lineage:</text>
    <text x="25" y="86" fill="#0f172a" font-size="9">revenue_usd =</text>
    <text x="25" y="103" fill="#0f172a" font-size="9">(amount_cents / 100.0) &#215; rate_to_usd</text>

    <!-- OpenLineage Telemetry -->
    <rect x="15" y="128" width="215" height="52" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="25" y="146" fill="#1e40af" font-size="10" font-weight="bold">OpenLineage Schema Facet:</text>
    <text x="25" y="162" fill="#475569" font-size="9">Maps target col &#8594; 2 upstream source cols</text>
  </g>

  <!-- Connector from Job to Gold -->
  <line x1="550" y1="215" x2="605" y2="215" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-lineage-red)"/>

  <!-- TARGET TABLE (Lakehouse Gold) -->
  <g transform="translate(610, 120)">
    <rect width="180" height="195" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <rect width="180" height="34" rx="12" fill="#ffedd5"/>
    <text x="90" y="22" text-anchor="middle" fill="#c2410c" font-size="12" font-weight="bold">Lakehouse: gold_kpi</text>

    <text x="15" y="55" fill="#475569" font-size="10">&#8226; metric_date (date)</text>
    
    <!-- Corrupted target column -->
    <rect x="10" y="68" width="160" height="42" rx="6" fill="#fef2f2" stroke="#f87171"/>
    <text x="15" y="86" fill="#dc2626" font-size="10" font-weight="bold">&#8226; total_revenue_usd</text>
    <text x="15" y="101" fill="#991b1b" font-size="9">Result: NULL (0.00$)</text>

    <text x="15" y="128" fill="#16a34a" font-size="10">&#8226; order_count (OK: 45,210)</text>
    <text x="15" y="148" fill="#475569" font-size="9">(Unrelated columns unaffected)</text>
  </g>

  <!-- Connector from Gold to Dashboard -->
  <line x1="790" y1="215" x2="825" y2="215" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-lineage-red)"/>

  <!-- DOWNSTREAM CONSUMER (Executive Dashboard) -->
  <g transform="translate(830, 120)">
    <rect width="115" height="195" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <rect width="115" height="34" rx="12" fill="#fee2e2"/>
    <text x="57" y="22" text-anchor="middle" fill="#991b1b" font-size="11" font-weight="bold">BI Widget</text>

    <rect x="10" y="55" width="95" height="75" rx="6" fill="#ffffff" stroke="#fca5a5"/>
    <text x="15" y="75" fill="#475569" font-size="9">Daily Sales:</text>
    <text x="15" y="98" fill="#dc2626" font-size="13" font-weight="bold">0.00 $</text>
    <text x="15" y="118" fill="#991b1b" font-size="8" font-weight="bold">&#9888; Alert Triggered</text>

    <text x="10" y="150" fill="#475569" font-size="8">Diagnostic Time:</text>
    <text x="10" y="166" fill="#16a34a" font-size="9" font-weight="bold">&#10004; Under 30s</text>
    <text x="10" y="180" fill="#475569" font-size="8">via Column Lineage</text>
  </g>
</svg>

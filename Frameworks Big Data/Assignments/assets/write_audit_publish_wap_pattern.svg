<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="100%" height="auto" style="background:transparent; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow-wap-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-wap-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-wap-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="30" text-anchor="middle" fill="#000000" font-size="20" font-weight="bold">Write-Audit-Publish (WAP) Architectural Pattern in Lakehouse</text>
  <text x="480" y="52" text-anchor="middle" fill="#475569" font-size="13" font-weight="500">Atomic branch staging &amp; quality assertions in Apache Iceberg / Delta Lake</text>

  <!-- STEP 1: WRITE -->
  <g transform="translate(30, 85)">
    <rect width="260" height="295" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect width="260" height="38" rx="12" fill="#dbeafe"/>
    <text x="130" y="24" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">Step 1: WRITE (Staging Branch)</text>

    <rect x="15" y="55" width="230" height="90" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="25" y="78" fill="#1d4ed8" font-size="12" font-weight="bold">Spark Writes to Branch</text>
    <text x="25" y="98" fill="#000000" font-size="10">&#8226; Target: <tspan font-weight="bold">branch_audit_202610</tspan></text>
    <text x="25" y="115" fill="#000000" font-size="10">&#8226; Production <tspan font-weight="bold">main</tspan> is NOT touched</text>
    <text x="25" y="132" fill="#475569" font-size="10">&#8226; Parquet files written to S3</text>

    <rect x="15" y="155" width="230" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="25" y="178" fill="#0f172a" font-size="11" font-weight="bold">Lakehouse Metadata Snapshot</text>
    <text x="25" y="198" fill="#475569" font-size="10">&#8226; Iceberg Snapshot S_new created</text>
    <text x="25" y="215" fill="#475569" font-size="10">&#8226; Zero lock contention with queries</text>
    <text x="25" y="233" fill="#16a34a" font-size="10" font-weight="bold">&#10004; Production table readers safe</text>
  </g>

  <!-- Arrow Step 1 to 2 -->
  <line x1="290" y1="220" x2="335" y2="220" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-wap-blue)"/>

  <!-- STEP 2: AUDIT -->
  <g transform="translate(340, 85)">
    <rect width="270" height="295" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <rect width="270" height="38" rx="12" fill="#ede9fe"/>
    <text x="135" y="24" text-anchor="middle" fill="#6d28d9" font-size="13" font-weight="bold">Step 2: AUDIT (Validation Gates)</text>

    <rect x="15" y="55" width="240" height="110" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
    <text x="25" y="78" fill="#6d28d9" font-size="12" font-weight="bold">Great Expectations / Soda Tests</text>
    <text x="25" y="98" fill="#000000" font-size="10">&#8226; ExpectColumnValuesToNotBeNull</text>
    <text x="25" y="115" fill="#000000" font-size="10">&#8226; Check Row Count &gt; Expected Min</text>
    <text x="25" y="132" fill="#000000" font-size="10">&#8226; Schema Conformance &amp; Types</text>
    <text x="25" y="149" fill="#000000" font-size="10">&#8226; Business Logic Reconciliation</text>

    <!-- Branch Decision Diamond Card -->
    <rect x="15" y="175" width="240" height="90" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
    <text x="25" y="198" fill="#854d0e" font-size="11" font-weight="bold">Audit Decision Gate:</text>
    <text x="25" y="218" fill="#166534" font-size="10" font-weight="bold">&#10004; IF ALL PASS &#8594; Fast-forward to Main</text>
    <text x="25" y="238" fill="#b91c1c" font-size="10" font-weight="bold">&#10008; IF ANY FAIL &#8594; Drop Staging Branch</text>
  </g>

  <!-- Arrow Step 2 to 3 -->
  <line x1="610" y1="180" x2="655" y2="150" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-wap-green)"/>
  <line x1="610" y1="260" x2="655" y2="290" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-wap-red)"/>

  <!-- STEP 3: PUBLISH OR ABORT -->
  <g transform="translate(660, 85)">
    <rect width="270" height="295" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <rect width="270" height="38" rx="12" fill="#e2e8f0"/>
    <text x="135" y="24" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="bold">Step 3: PUBLISH or ABORT</text>

    <!-- Success Outcome -->
    <rect x="15" y="55" width="240" height="105" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="25" y="78" fill="#166534" font-size="12" font-weight="bold">&#10004; ATOMIC PUBLISH (Success)</text>
    <text x="25" y="98" fill="#000000" font-size="10">&#8226; Fast-forward metadata pointer to Main</text>
    <text x="25" y="115" fill="#000000" font-size="10">&#8226; Atomic ACID commit in milliseconds</text>
    <text x="25" y="132" fill="#059669" font-size="10" font-weight="bold">&#8594; Consumers immediately see clean data</text>

    <!-- Fail Outcome -->
    <rect x="15" y="170" width="240" height="105" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="25" y="193" fill="#991b1b" font-size="12" font-weight="bold">&#10008; ABORT &amp; PURGE (Failure)</text>
    <text x="25" y="213" fill="#000000" font-size="10">&#8226; Drop audit branch immediately</text>
    <text x="25" y="230" fill="#000000" font-size="10">&#8226; Production main remains 100% pristine</text>
    <text x="25" y="247" fill="#dc2626" font-size="10" font-weight="bold">&#8594; Zero partial/corrupted records leak</text>
  </g>
</svg>

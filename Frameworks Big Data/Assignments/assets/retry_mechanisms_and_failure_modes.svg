<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="auto" style="background:transparent; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="30" text-anchor="middle" fill="#000000" font-size="20" font-weight="bold">Pipeline Failure Recovery: Naive Retries vs. Resilient Strategies</text>
  <text x="480" y="52" text-anchor="middle" fill="#475569" font-size="13" font-weight="500">Comparing Pathologies of Naive Loops with Fault-Tolerant Architectural Patterns</text>

  <!-- LEFT PANEL: Naive Retry Pathologies -->
  <g transform="translate(30, 75)">
    <rect width="430" height="340" rx="12" fill="#fff5f5" stroke="#f87171" stroke-width="2"/>
    <rect width="430" height="40" rx="12" fill="#fee2e2"/>
    <text x="215" y="26" text-anchor="middle" fill="#991b1b" font-size="14" font-weight="bold">&#9888; Naive Retry Pathologies (Failure Modes)</text>

    <!-- Pathology 1: Retry Storm -->
    <rect x="20" y="55" width="390" height="75" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="35" y="78" fill="#991b1b" font-size="12" font-weight="bold">1. Retry Storm &amp; Thundering Herd</text>
    <text x="35" y="98" fill="#000000" font-size="11">&#8226; Fixed intervals cause concurrent workers to bombard degraded DB</text>
    <text x="35" y="115" fill="#475569" font-size="10">&#8594; Result: Amplified downtime &amp; cascading failure across microservices</text>

    <!-- Pathology 2: Non-Idempotent Corruption -->
    <rect x="20" y="145" width="390" height="75" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="35" y="168" fill="#991b1b" font-size="12" font-weight="bold">2. Non-Idempotent Duplications (Double-Write)</text>
    <text x="35" y="188" fill="#000000" font-size="11">&#8226; Task fails AFTER partial insert; retry inserts records a second time</text>
    <text x="35" y="205" fill="#475569" font-size="10">&#8594; Result: Corrupted aggregations, duplicate financial/BI metrics</text>

    <!-- Pathology 3: Poison Pill & Starvation -->
    <rect x="20" y="235" width="390" height="85" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="35" y="258" fill="#991b1b" font-size="12" font-weight="bold">3. Poison Pill &amp; Worker Starvation</text>
    <text x="35" y="278" fill="#000000" font-size="11">&#8226; Malformed schema/syntax is deterministic (can NEVER succeed)</text>
    <text x="35" y="295" fill="#475569" font-size="10">&#8594; Result: Wasted cluster compute hours &amp; blocked queue slots</text>
  </g>

  <!-- RIGHT PANEL: Resilient Architectural Remedy -->
  <g transform="translate(500, 75)">
    <rect width="430" height="340" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
    <rect width="430" height="40" rx="12" fill="#dcfce7"/>
    <text x="215" y="26" text-anchor="middle" fill="#166534" font-size="14" font-weight="bold">&#10004; Resilient Recovery Architecture (Production Best Practices)</text>

    <!-- Strategy 1: Exponential Backoff + Jitter -->
    <rect x="20" y="55" width="390" height="75" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="35" y="78" fill="#166534" font-size="12" font-weight="bold">1. Exponential Backoff with Jitter</text>
    <text x="35" y="98" fill="#000000" font-size="11">&#8226; Delay = min(MaxWait, Base &#215; 2^attempt) &#177; UniformRandom()</text>
    <text x="35" y="115" fill="#475569" font-size="10">&#8594; De-synchronizes worker waves &amp; gives services room to recover</text>

    <!-- Strategy 2: Idempotent Operations (WAP) -->
    <rect x="20" y="145" width="390" height="75" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="35" y="168" fill="#166534" font-size="12" font-weight="bold">2. Enforced Idempotency &amp; Atomic Swaps</text>
    <text x="35" y="188" fill="#000000" font-size="11">&#8226; UPSERT / MERGE via ACID Lakehouse (Delta/Iceberg)</text>
    <text x="35" y="205" fill="#475569" font-size="10">&#8594; Write-Audit-Publish pattern guarantees zero duplicate records</text>

    <!-- Strategy 3: Dead Letter Queue & Circuit Breakers -->
    <rect x="20" y="235" width="390" height="85" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="35" y="258" fill="#166534" font-size="12" font-weight="bold">3. Dead Letter Queue (DLQ) &amp; Circuit Breaker</text>
    <text x="35" y="278" fill="#000000" font-size="11">&#8226; Route corrupted records to quarantine tables without failing pipeline</text>
    <text x="35" y="295" fill="#475569" font-size="10">&#8594; Circuit breaker trips if error rate exceeds 5%, halting damage</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="auto" style="background:transparent; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="32" text-anchor="middle" fill="#000000" font-size="20" font-weight="bold">Data Observability &amp; Lineage in Production</text>
  <text x="480" y="54" text-anchor="middle" fill="#475569" font-size="13" font-weight="500">Root Cause Analysis (Upstream) vs. Impact Analysis (Downstream)</text>

  <!-- Section 1: Upstream Sources -->
  <g transform="translate(30, 85)">
    <rect width="200" height="280" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <rect width="200" height="38" rx="12" fill="#e2e8f0"/>
    <text x="100" y="24" text-anchor="middle" fill="#000000" font-size="13" font-weight="bold">1. Upstream Data Sources</text>

    <!-- Source A -->
    <rect x="15" y="55" width="170" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="25" y="80" fill="#000000" font-size="12" font-weight="bold">OLTP Database</text>
    <text x="25" y="100" fill="#475569" font-size="11">PostgreSQL (Schema Drift)</text>

    <!-- Source B -->
    <rect x="15" y="130" width="170" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="25" y="155" fill="#000000" font-size="12" font-weight="bold">Streaming Ingestion</text>
    <text x="25" y="175" fill="#475569" font-size="11">Kafka Topic (Delayed msgs)</text>

    <!-- Root Cause Note -->
    <rect x="15" y="205" width="170" height="60" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
    <text x="25" y="228" fill="#991b1b" font-size="11" font-weight="bold">&#9664; Root Cause Origin</text>
    <text x="25" y="248" fill="#b91c1c" font-size="10">Source column type altered</text>
  </g>

  <!-- Connectors: Source to Engine -->
  <line x1="230" y1="170" x2="275" y2="170" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Section 2: Pipeline Processing & Failure Point -->
  <g transform="translate(280, 85)">
    <rect width="230" height="280" rx="12" fill="#ffffff" stroke="#ef4444" stroke-width="2.5"/>
    <rect width="230" height="38" rx="12" fill="#fee2e2"/>
    <text x="115" y="24" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="bold">2. Orchestration &amp; Compute</text>

    <!-- Task Failure Card -->
    <rect x="15" y="55" width="200" height="95" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
    <text x="25" y="78" fill="#000000" font-size="12" font-weight="bold">Spark / dbt Model Job</text>
    <text x="25" y="98" fill="#dc2626" font-size="11" font-weight="bold">&#9888; Task Failed: Type Mismatch</text>
    <text x="25" y="118" fill="#475569" font-size="10">Airflow / Dagster Orchestrator</text>
    <text x="25" y="135" fill="#475569" font-size="10">Status: FAILED (Retries: 3/3 exhausted)</text>

    <!-- OpenLineage Telemetry -->
    <rect x="15" y="165" width="200" height="95" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="25" y="188" fill="#1e40af" font-size="12" font-weight="bold">OpenLineage Metadata</text>
    <text x="25" y="208" fill="#000000" font-size="10">&#8226; RunEvent: COMPLETE / FAIL</text>
    <text x="25" y="226" fill="#000000" font-size="10">&#8226; Column-level Lineage Facets</text>
    <text x="25" y="244" fill="#000000" font-size="10">&#8226; Emitted to Marquez / DataHub</text>
  </g>

  <!-- Connectors: Engine to Downstream -->
  <line x1="510" y1="170" x2="555" y2="170" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow-red)"/>

  <!-- Section 3: Observability & Lineage Graph Engine -->
  <g transform="translate(560, 85)">
    <rect width="180" height="280" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <rect width="180" height="38" rx="12" fill="#ede9fe"/>
    <text x="90" y="24" text-anchor="middle" fill="#5b21b6" font-size="13" font-weight="bold">3. Lineage Diagnosis</text>

    <rect x="15" y="55" width="150" height="95" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
    <text x="25" y="78" fill="#000000" font-size="11" font-weight="bold">Upstream Tracing</text>
    <text x="25" y="98" fill="#6b21a8" font-size="10">&#8592; Pinpoint Root Cause</text>
    <text x="25" y="116" fill="#475569" font-size="10">Identifies schema mismatch</text>
    <text x="25" y="134" fill="#475569" font-size="10">in source table within seconds</text>

    <rect x="15" y="165" width="150" height="95" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
    <text x="25" y="188" fill="#000000" font-size="11" font-weight="bold">Downstream Tracing</text>
    <text x="25" y="208" fill="#6b21a8" font-size="10">&#8594; Blast Radius Analysis</text>
    <text x="25" y="226" fill="#475569" font-size="10">Evaluates impacted tables,</text>
    <text x="25" y="244" fill="#475569" font-size="10">BI reports &amp; ML pipelines</text>
  </g>

  <!-- Connectors: Observability to Consumers -->
  <line x1="740" y1="170" x2="775" y2="170" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- Section 4: Downstream Impact / Consumers -->
  <g transform="translate(780, 85)">
    <rect width="150" height="280" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <rect width="150" height="38" rx="12" fill="#e2e8f0"/>
    <text x="75" y="24" text-anchor="middle" fill="#000000" font-size="13" font-weight="bold">4. Blast Radius</text>

    <!-- Impacted Asset A -->
    <rect x="12" y="55" width="126" height="60" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="20" y="78" fill="#000000" font-size="11" font-weight="bold">Lakehouse Gold</text>
    <text x="20" y="98" fill="#b91c1c" font-size="10">&#9888; Data Stale (SLA Breached)</text>

    <!-- Impacted Asset B -->
    <rect x="12" y="125" width="126" height="60" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="20" y="148" fill="#000000" font-size="11" font-weight="bold">BI Executive Dash</text>
    <text x="20" y="168" fill="#b91c1c" font-size="10">&#9888; Blocked Automated Sync</text>

    <!-- Impacted Asset C -->
    <rect x="12" y="195" width="126" height="60" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="20" y="218" fill="#000000" font-size="11" font-weight="bold">ML Feature Store</text>
    <text x="20" y="238" fill="#b91c1c" font-size="10">&#9888; Training Halted</text>
  </g>

  <!-- Legend Bottom Bar -->
  <g transform="translate(100, 380)">
    <circle cx="10" cy="10" r="6" fill="#dc2626"/>
    <text x="25" y="14" fill="#000000" font-size="11" font-weight="600">Failed / Impacted Nodes</text>

    <circle cx="230" cy="10" r="6" fill="#2563eb"/>
    <text x="245" y="14" fill="#000000" font-size="11" font-weight="600">Active Pipeline Flow</text>

    <circle cx="430" cy="10" r="6" fill="#7c3aed"/>
    <text x="445" y="14" fill="#000000" font-size="11" font-weight="600">Lineage Correlation &amp; Telemetry</text>

    <circle cx="680" cy="10" r="6" fill="#059669"/>
    <text x="695" y="14" fill="#000000" font-size="11" font-weight="600">Healthy Upstream Components</text>
  </g>
</svg>

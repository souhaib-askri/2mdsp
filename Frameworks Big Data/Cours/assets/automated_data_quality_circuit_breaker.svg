<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="auto" style="background:transparent; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow-blue2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="32" text-anchor="middle" fill="#000000" font-size="20" font-weight="bold">Automated Data Quality &amp; Circuit Breaker Architecture</text>
  <text x="480" y="54" text-anchor="middle" fill="#475569" font-size="13" font-weight="500">Continuous Validation with Great Expectations, Soda &amp; Dead-Letter Routing</text>

  <!-- Step 1: Ingestion Stage -->
  <g transform="translate(25, 90)">
    <rect width="180" height="230" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <rect width="180" height="36" rx="10" fill="#f1f5f9"/>
    <text x="90" y="24" text-anchor="middle" fill="#000000" font-size="13" font-weight="bold">1. Ingestion Staging</text>
    
    <rect x="12" y="55" width="156" height="50" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="22" y="78" fill="#000000" font-size="11" font-weight="bold">Bronze / Raw Zone</text>
    <text x="22" y="94" fill="#475569" font-size="10">Kafka &amp; Cloud Storage</text>

    <rect x="12" y="120" width="156" height="85" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="22" y="142" fill="#000000" font-size="11" font-weight="bold">Telemetry Extraction</text>
    <text x="22" y="160" fill="#475569" font-size="10">&#8226; Row counts</text>
    <text x="22" y="177" fill="#475569" font-size="10">&#8226; Timestamps &amp; Freshness</text>
    <text x="22" y="194" fill="#475569" font-size="10">&#8226; Schema definitions</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <line x1="205" y1="205" x2="245" y2="205" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue2)"/>

  <!-- Step 2: Quality Engine & Checks -->
  <g transform="translate(250, 90)">
    <rect width="230" height="230" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect width="230" height="36" rx="10" fill="#dbeafe"/>
    <text x="115" y="24" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">2. Quality Engine Validation</text>

    <rect x="15" y="50" width="200" height="75" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="25" y="72" fill="#1e3a8a" font-size="11" font-weight="bold">Rule &amp; Constraint Testing</text>
    <text x="25" y="90" fill="#000000" font-size="10">&#8226; ExpectColumnValuesToNotBeNull</text>
    <text x="25" y="105" fill="#000000" font-size="10">&#8226; ExpectColumnUnique &amp; Range Checks</text>
    <text x="25" y="118" fill="#475569" font-size="9">(Great Expectations / Soda Core / dbt)</text>

    <rect x="15" y="135" width="200" height="75" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="25" y="157" fill="#1e3a8a" font-size="11" font-weight="bold">Statistical Anomaly Detection</text>
    <text x="25" y="175" fill="#000000" font-size="10">&#8226; Distribution drift (KL-divergence)</text>
    <text x="25" y="190" fill="#000000" font-size="10">&#8226; Volume &amp; Variance spike alerts</text>
    <text x="25" y="203" fill="#475569" font-size="9">(Monte Carlo / Databand telemetry)</text>
  </g>

  <!-- Arrow 2 to Decision -->
  <line x1="480" y1="205" x2="520" y2="205" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue2)"/>

  <!-- Decision Point: Quality Gate -->
  <g transform="translate(525, 145)">
    <polygon points="60,0 120,60 60,120 0,60" fill="#fef9c3" stroke="#eab308" stroke-width="2.5"/>
    <text x="60" y="55" text-anchor="middle" fill="#854d0e" font-size="11" font-weight="bold">Assertions</text>
    <text x="60" y="72" text-anchor="middle" fill="#854d0e" font-size="11" font-weight="bold">Passed?</text>
  </g>

  <!-- Pass Branch (Up and Right) -->
  <path d="M 585 145 L 585 120 L 710 120" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green2)"/>
  <text x="620" y="112" fill="#059669" font-size="11" font-weight="bold">&#10004; PASSED</text>

  <!-- Step 3A: Clean Gold Lakehouse -->
  <g transform="translate(715, 75)">
    <rect width="215" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <rect width="215" height="32" rx="10" fill="#dcfce7"/>
    <text x="107" y="21" text-anchor="middle" fill="#166534" font-size="12" font-weight="bold">Gold Lakehouse / Production</text>
    
    <text x="15" y="52" fill="#000000" font-size="10" font-weight="bold">Write-Audit-Publish (WAP)</text>
    <text x="15" y="68" fill="#475569" font-size="10">&#8226; Atomic snapshot published</text>
    <text x="15" y="84" fill="#475569" font-size="10">&#8226; Trusted by BI &amp; ML consumers</text>
    <text x="15" y="99" fill="#16a34a" font-size="10" font-weight="bold">&#10004; Zero Silent Corruption</text>
  </g>

  <!-- Fail Branch (Down and Right) -->
  <path d="M 585 265 L 585 285 L 710 285" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red2)"/>
  <text x="615" y="278" fill="#dc2626" font-size="11" font-weight="bold">&#10008; BREACHED</text>

  <!-- Step 3B: Circuit Breaker Quarantine -->
  <g transform="translate(715, 235)">
    <rect width="215" height="110" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <rect width="215" height="32" rx="10" fill="#fee2e2"/>
    <text x="107" y="21" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="bold">Circuit Breaker &amp; Quarantine</text>
    
    <text x="15" y="52" fill="#000000" font-size="10" font-weight="bold">Dead-Letter Table (DLQ)</text>
    <text x="15" y="68" fill="#475569" font-size="10">&#8226; Faulty records isolated</text>
    <text x="15" y="84" fill="#475569" font-size="10">&#8226; Automated PagerDuty Alert</text>
    <text x="15" y="99" fill="#dc2626" font-size="10" font-weight="bold">&#9888; Downstream sync halted</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="100%" height="auto" style="background:transparent; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="470" y="38" text-anchor="middle" fill="#000000" font-size="22" font-weight="bold">Web Application Architectural Patterns</text>
  <text x="470" y="64" text-anchor="middle" fill="#334155" font-size="14" font-weight="500">Comparative Analysis: Traditional MVC vs. Python-centric MVT Pattern</text>

  <!-- ================= LEFT PANEL: MVC ARCHITECTURE ================= -->
  <g transform="translate(30, 90)">
    <!-- Container Card -->
    <rect x="0" y="0" width="425" height="400" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#card-shadow)"/>
    
    <!-- Header Badge -->
    <rect x="20" y="16" width="385" height="36" rx="8" fill="#e0f2fe"/>
    <text x="212" y="40" text-anchor="middle" fill="#0369a1" font-size="16" font-weight="bold">MVC Architecture (Classic Web)</text>

    <!-- Client / Browser -->
    <rect x="35" y="75" width="355" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="212" y="96" text-anchor="middle" fill="#000000" font-size="14" font-weight="bold">Client (Web Browser / Mobile App)</text>
    <text x="212" y="114" text-anchor="middle" fill="#475569" font-size="12">Sends HTTP Requests &amp; Receives Rendered HTML/JSON</text>

    <!-- Controller Card -->
    <rect x="35" y="160" width="160" height="75" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="115" y="186" text-anchor="middle" fill="#000000" font-size="14" font-weight="bold">Controller</text>
    <text x="115" y="206" text-anchor="middle" fill="#0369a1" font-size="11" font-weight="600">Handles HTTP requests,</text>
    <text x="115" y="222" text-anchor="middle" fill="#475569" font-size="11">coordinates M &amp; V</text>

    <!-- Model Card -->
    <rect x="230" y="160" width="160" height="75" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="310" y="186" text-anchor="middle" fill="#000000" font-size="14" font-weight="bold">Model</text>
    <text x="310" y="206" text-anchor="middle" fill="#15803d" font-size="11" font-weight="600">Data, Business Rules,</text>
    <text x="310" y="222" text-anchor="middle" fill="#475569" font-size="11">ORM &amp; Database State</text>

    <!-- View Card -->
    <rect x="132" y="280" width="160" height="75" rx="8" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
    <text x="212" y="306" text-anchor="middle" fill="#000000" font-size="14" font-weight="bold">View</text>
    <text x="212" y="326" text-anchor="middle" fill="#7e22ce" font-size="11" font-weight="600">User Interface Display,</text>
    <text x="212" y="342" text-anchor="middle" fill="#475569" font-size="11">Visual Representation</text>

    <!-- Connectors -->
    <path d="M 115 125 L 115 152" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
    <path d="M 195 197 L 222 197" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
    <path d="M 310 235 L 310 317 L 300 317" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
    <path d="M 132 317 L 60 317 L 60 133" fill="none" stroke="#a855f7" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

    <text x="212" y="382" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">Frameworks: Spring MVC, Ruby on Rails, Express (MVC style)</text>
  </g>

  <!-- ================= RIGHT PANEL: MVT ARCHITECTURE ================= -->
  <g transform="translate(485, 90)">
    <!-- Container Card -->
    <rect x="0" y="0" width="425" height="400" rx="14" fill="#ffffff" stroke="#059669" stroke-width="2" filter="url(#card-shadow)"/>

    <!-- Header Badge -->
    <rect x="20" y="16" width="385" height="36" rx="8" fill="#d1fae5"/>
    <text x="212" y="40" text-anchor="middle" fill="#065f46" font-size="16" font-weight="bold">MVT Architecture (Python / Django)</text>

    <!-- Client / Browser -->
    <rect x="35" y="75" width="355" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="212" y="96" text-anchor="middle" fill="#000000" font-size="14" font-weight="bold">Client (Web Browser / API Consumer)</text>
    <text x="212" y="114" text-anchor="middle" fill="#475569" font-size="12">Sends Request -> URL Router maps to View</text>

    <!-- View (Controller logic) -->
    <rect x="35" y="160" width="160" height="75" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="115" y="186" text-anchor="middle" fill="#000000" font-size="14" font-weight="bold">View (acts as Controller)</text>
    <text x="115" y="206" text-anchor="middle" fill="#1d4ed8" font-size="11" font-weight="600">Executes business logic,</text>
    <text x="115" y="222" text-anchor="middle" fill="#475569" font-size="11">fetches Model &amp; context</text>

    <!-- Model Card -->
    <rect x="230" y="160" width="160" height="75" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="310" y="186" text-anchor="middle" fill="#000000" font-size="14" font-weight="bold">Model</text>
    <text x="310" y="206" text-anchor="middle" fill="#15803d" font-size="11" font-weight="600">ORM Mapping (models.py),</text>
    <text x="310" y="222" text-anchor="middle" fill="#475569" font-size="11">Database schema &amp; logic</text>

    <!-- Template Card -->
    <rect x="132" y="280" width="160" height="75" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="212" y="306" text-anchor="middle" fill="#000000" font-size="14" font-weight="bold">Template</text>
    <text x="212" y="326" text-anchor="middle" fill="#b45309" font-size="11" font-weight="600">HTML + Jinja2 / DTL tags,</text>
    <text x="212" y="342" text-anchor="middle" fill="#475569" font-size="11">Visual rendering layer</text>

    <!-- Connectors -->
    <path d="M 115 125 L 115 152" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-emerald)"/>
    <path d="M 195 197 L 222 197" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-emerald)"/>
    <path d="M 115 235 L 115 295 L 124 295" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-emerald)"/>
    <path d="M 212 280 L 212 245 L 310 245 L 310 240" fill="none" stroke="#d97706" stroke-width="1.8"/>
    <path d="M 292 317 L 375 317 L 375 133" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow-emerald)"/>

    <text x="212" y="382" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">Frameworks: Django (native MVT), Flask (using Views &amp; Jinja2)</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="auto" style="background:transparent; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" fill="#000000" font-size="22" font-weight="bold">Flask Web Application Architecture with OOP Integration</text>
  <text x="480" y="64" text-anchor="middle" fill="#334155" font-size="14" font-weight="500">End-to-End Flow: Client Request, Routing, OOP Model Encapsulation, and Jinja2 Templating</text>

  <!-- 1. Client / Browser -->
  <g transform="translate(30, 95)">
    <rect x="0" y="0" width="180" height="370" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
    <rect x="12" y="14" width="156" height="34" rx="6" fill="#e0f2fe"/>
    <text x="90" y="37" text-anchor="middle" fill="#0369a1" font-size="14" font-weight="bold">1. Web Client</text>

    <rect x="15" y="70" width="150" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="90" y="94" text-anchor="middle" fill="#000000" font-size="12" font-weight="bold">inscription.html</text>
    <text x="90" y="112" text-anchor="middle" fill="#475569" font-size="11">Form Inputs:</text>
    <text x="90" y="128" text-anchor="middle" fill="#0284c7" font-size="10">nom, prenom, email...</text>

    <text x="90" y="180" text-anchor="middle" fill="#0284c7" font-size="12" font-weight="bold">HTTP POST</text>
    <path d="M 90 190 L 90 230" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>

    <rect x="15" y="240" width="150" height="70" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="90" y="264" text-anchor="middle" fill="#000000" font-size="12" font-weight="bold">resultat.html</text>
    <text x="90" y="282" text-anchor="middle" fill="#15803d" font-size="11">Displays User Info</text>
    <text x="90" y="298" text-anchor="middle" fill="#475569" font-size="10">Styled by style.css</text>

    <text x="90" y="348" text-anchor="middle" fill="#64748b" font-size="11">Browser Session</text>
  </g>

  <!-- Request Arrow -->
  <path d="M 210 180 L 260 180" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="235" y="172" text-anchor="middle" fill="#0369a1" font-size="10" font-weight="bold">POST</text>

  <!-- 2. Flask Controller (app.py) -->
  <g transform="translate(265, 95)">
    <rect x="0" y="0" width="220" height="370" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
    <rect x="12" y="14" width="196" height="34" rx="6" fill="#eff6ff"/>
    <text x="110" y="37" text-anchor="middle" fill="#1d4ed8" font-size="14" font-weight="bold">2. Flask Controller (app.py)</text>

    <!-- Route 1 -->
    <rect x="15" y="65" width="190" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="22" y="85" fill="#000000" font-size="11" font-family="monospace">@app.route("/")</text>
    <text x="22" y="105" fill="#475569" font-size="11">def inscription():</text>
    <text x="35" y="118" fill="#1d4ed8" font-size="10">render_template(...)</text>

    <!-- Route 2 -->
    <rect x="15" y="140" width="190" height="150" rx="6" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="22" y="160" fill="#000000" font-size="11" font-family="monospace">@app.route("/inscription",</text>
    <text x="32" y="176" fill="#000000" font-size="11" font-family="monospace">methods=["POST"])</text>
    <text x="22" y="196" fill="#475569" font-size="11">def traiter_inscription():</text>
    <text x="32" y="212" fill="#334155" font-size="10">nom = request.form["nom"]</text>
    <text x="32" y="228" fill="#334155" font-size="10">...</text>
    <text x="32" y="248" fill="#059669" font-size="11" font-weight="bold">user1 = User(...)</text>
    <text x="32" y="272" fill="#d97706" font-size="10" font-family="monospace">return render_template(</text>
    <text x="42" y="284" fill="#d97706" font-size="10" font-family="monospace">"resultat.html", U1=user1)</text>

    <text x="110" y="348" text-anchor="middle" fill="#64748b" font-size="11">WSGI Application Core</text>
  </g>

  <!-- Connectors between Controller & Model -->
  <path d="M 485 245 L 530 245" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="508" y="237" text-anchor="middle" fill="#059669" font-size="10" font-weight="bold">Instantiate</text>

  <!-- 3. OOP Model (models/user.py) -->
  <g transform="translate(535, 95)">
    <rect x="0" y="0" width="200" height="370" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
    <rect x="12" y="14" width="176" height="34" rx="6" fill="#ecfdf5"/>
    <text x="100" y="37" text-anchor="middle" fill="#047857" font-size="14" font-weight="bold">3. OOP Model (User)</text>

    <rect x="15" y="65" width="170" height="110" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="22" y="85" fill="#000000" font-size="11" font-weight="bold">Private Attributes:</text>
    <text x="22" y="105" fill="#b91c1c" font-size="10" font-family="monospace">• self.__nom</text>
    <text x="22" y="122" fill="#b91c1c" font-size="10" font-family="monospace">• self.__prenom</text>
    <text x="22" y="139" fill="#b91c1c" font-size="10" font-family="monospace">• self.__email</text>
    <text x="22" y="156" fill="#b91c1c" font-size="10" font-family="monospace">• self.__mot_de_passe</text>

    <rect x="15" y="190" width="170" height="115" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="22" y="210" fill="#000000" font-size="11" font-weight="bold">Public Accessors (POO):</text>
    <text x="22" y="230" fill="#15803d" font-size="10" font-family="monospace">+ get_nom() / set_nom()</text>
    <text x="22" y="248" fill="#15803d" font-size="10" font-family="monospace">+ get_prenom()</text>
    <text x="22" y="266" fill="#15803d" font-size="10" font-family="monospace">+ get_email()</text>
    <text x="22" y="284" fill="#15803d" font-size="10" font-family="monospace">+ get_date_naissance()</text>

    <text x="100" y="348" text-anchor="middle" fill="#64748b" font-size="11">Encapsulated Business Object</text>
  </g>

  <!-- Connectors between Model & Jinja2 -->
  <path d="M 735 245 L 775 245" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)"/>
  <text x="755" y="237" text-anchor="middle" fill="#d97706" font-size="10" font-weight="bold">Context</text>

  <!-- 4. Jinja2 Template Engine -->
  <g transform="translate(780, 95)">
    <rect x="0" y="0" width="165" height="370" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
    <rect x="10" y="14" width="145" height="34" rx="6" fill="#fffbeb"/>
    <text x="82" y="37" text-anchor="middle" fill="#b45309" font-size="13" font-weight="bold">4. Jinja2 Engine</text>

    <rect x="12" y="70" width="141" height="150" rx="6" fill="#fefce8" stroke="#fde047" stroke-width="1"/>
    <text x="18" y="90" fill="#000000" font-size="11" font-weight="bold">Template Syntax:</text>
    <text x="18" y="112" fill="#713f12" font-size="10" font-family="monospace">{{ U1.get_nom() }}</text>
    <text x="18" y="132" fill="#713f12" font-size="10" font-family="monospace">{{ U1.get_prenom() }}</text>
    <text x="18" y="152" fill="#713f12" font-size="10" font-family="monospace">{{ U1.get_email() }}</text>
    <text x="18" y="172" fill="#713f12" font-size="10" font-family="monospace">{{ U1.get_date... }}</text>
    <text x="18" y="200" fill="#475569" font-size="10">Calls object methods</text>
    <text x="18" y="213" fill="#475569" font-size="10">safely during render</text>

    <rect x="12" y="240" width="141" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="82" y="265" text-anchor="middle" fill="#000000" font-size="11" font-weight="bold">Generates HTML</text>
    <text x="82" y="285" text-anchor="middle" fill="#15803d" font-size="11" font-weight="bold">HTTP 200 OK</text>

    <text x="82" y="348" text-anchor="middle" fill="#64748b" font-size="11">Server-Side Render</text>
  </g>

  <!-- Return Flow Arrow back to Client -->
  <path d="M 850 420 L 850 480 L 110 480 L 110 465" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr-green)"/>
  <text x="480" y="474" text-anchor="middle" fill="#059669" font-size="11" font-weight="bold">Rendered HTML Response Stream to Browser</text>
</svg>

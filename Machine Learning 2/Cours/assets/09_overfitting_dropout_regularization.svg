<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%" style="background:transparent;">
  <defs>
    <filter id="regShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="475" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Deep Learning Regularization &amp; Generalization</text>
  <text x="475" y="54" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#475569">Mitigating Overfitting via Early Stopping, Learning Curves, and Inverted Dropout</text>

  <!-- Left: Learning Curves (Overfitting Gap) -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="410" height="370" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#regShadow)"/>
    <rect x="0" y="0" width="410" height="36" rx="8" fill="#dbeafe"/>
    <text x="205" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e40af">1. Training vs Validation Dynamics (Loss Curves)</text>

    <!-- Axes -->
    <line x1="45" y1="280" x2="380" y2="280" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="45" y1="60" x2="45" y2="280" stroke="#0f172a" stroke-width="1.5"/>
    <text x="380" y="296" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0f172a">Epochs →</text>
    <text x="38" y="72" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0f172a">Loss</text>

    <!-- Training Loss Curve (Blue): Constantly decreases -->
    <path d="M 50 100 Q 120 220 200 245 T 370 265" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <text x="370" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#2563eb">Training Loss</text>

    <!-- Validation Loss Curve (Red): Decreases then diverges upwards -->
    <path d="M 50 115 Q 120 215 190 225 Q 260 235 370 140" fill="none" stroke="#ef4444" stroke-width="2.5"/>
    <text x="370" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#ef4444">Validation Loss</text>

    <!-- Optimal Stopping Point (Early Stopping) -->
    <line x1="190" y1="65" x2="190" y2="280" stroke="#10b981" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="190" cy="225" r="5" fill="#10b981"/>
    <text x="190" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#059669">Early Stopping Point</text>

    <!-- Overfitting Area shading indication -->
    <rect x="230" y="160" width="130" height="75" rx="4" fill="#fee2e2" opacity="0.6"/>
    <text x="295" y="195" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#991b1b">OVERFITTING</text>
    <text x="295" y="212" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#b91c1c">Generalization Gap</text>

    <text x="205" y="325" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">• Low Training Loss + High Validation Loss = Overfitting</text>
    <text x="205" y="342" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#475569">• Solution: Halt training before divergence occurs.</text>
  </g>

  <!-- Right: Inverted Dropout Mechanism -->
  <g transform="translate(485, 80)">
    <rect x="0" y="0" width="425" height="370" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#regShadow)"/>
    <rect x="0" y="0" width="425" height="36" rx="8" fill="#d1fae5"/>
    <text x="212" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#065f46">2. Inverted Dropout Mechanism (Srivastava et al., 2014)</text>

    <!-- Training Phase Subcard -->
    <rect x="20" y="55" width="185" height="210" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="112" y="76" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0f172a">During Training (p = 0.5)</text>

    <!-- Active and Dropped Neurons -->
    <circle cx="65" cy="115" r="14" fill="#3b82f6" stroke="#1d4f91" stroke-width="1.5"/>
    <text x="65" y="119" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffffff">ON</text>

    <!-- Dropped (Crossed out) -->
    <circle cx="155" cy="115" r="14" fill="#f1f5f9" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 2"/>
    <line x1="145" y1="105" x2="165" y2="125" stroke="#ef4444" stroke-width="2"/>
    <line x1="165" y1="105" x2="145" y2="125" stroke="#ef4444" stroke-width="2"/>

    <circle cx="65" cy="165" r="14" fill="#f1f5f9" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 2"/>
    <line x1="55" y1="155" x2="75" y2="175" stroke="#ef4444" stroke-width="2"/>
    <line x1="75" y1="155" x2="55" y2="175" stroke="#ef4444" stroke-width="2"/>

    <circle cx="155" cy="165" r="14" fill="#3b82f6" stroke="#1d4f91" stroke-width="1.5"/>
    <text x="155" y="169" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffffff">ON</text>

    <circle cx="110" cy="215" r="14" fill="#3b82f6" stroke="#1d4f91" stroke-width="1.5"/>
    <text x="110" y="219" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffffff">ON</text>

    <text x="112" y="250" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#ef4444">Random Masking (Bernoulli)</text>

    <!-- Inference Phase Subcard -->
    <rect x="220" y="55" width="185" height="210" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="312" y="76" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#065f46">At Test / Inference Time</text>

    <!-- All Active Neurons -->
    <circle cx="265" cy="115" r="14" fill="#10b981" stroke="#047857" stroke-width="1.5"/>
    <text x="265" y="119" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffffff">ON</text>

    <circle cx="355" cy="115" r="14" fill="#10b981" stroke="#047857" stroke-width="1.5"/>
    <text x="355" y="119" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffffff">ON</text>

    <circle cx="265" cy="165" r="14" fill="#10b981" stroke="#047857" stroke-width="1.5"/>
    <text x="265" y="169" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffffff">ON</text>

    <circle cx="355" cy="165" r="14" fill="#10b981" stroke="#047857" stroke-width="1.5"/>
    <text x="355" y="169" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffffff">ON</text>

    <circle cx="310" cy="215" r="14" fill="#10b981" stroke="#047857" stroke-width="1.5"/>
    <text x="310" y="219" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffffff">ON</text>

    <text x="312" y="250" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#059669">100% Architecture Active</text>

    <!-- Inverted Dropout Formula Bottom Box -->
    <rect x="20" y="280" width="385" height="75" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">Inverted Dropout Scaling Formulation:</text>
    <text x="30" y="320" font-family="monospace" font-size="11" fill="#059669">a^[l]_{train} = (a^[l] ⊙ m) / (1 - p)   ;   m ~ Bernoulli(1 - p)</text>
    <text x="30" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#475569">• Prevents co-adaptation of feature detectors across neurons.</text>
  </g>
</svg>

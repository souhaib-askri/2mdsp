<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 480" width="100%" height="100%" style="background:transparent;">
  <defs>
    <marker id="arr-red-opt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arr-green-opt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <filter id="card-sh-2" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="525" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Loss Landscape Topology &amp; Gradient Descent (Loss Landscape &amp; Optimization)</text>
  <text x="525" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#475569">Parameter Space &amp; Negative Gradient Trajectory</text>

  <!-- Left Card: Contour Map of Loss Surface -->
  <g transform="translate(30, 95)">
    <rect width="490" height="360" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-sh-2)"/>
    <rect width="490" height="36" rx="16" fill="#f8fafc"/>
    <text x="245" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e293b">Module Component L(w, b) Module Component</text>

    <!-- Axes -->
    <line x1="60" y1="280" x2="440" y2="280" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="80" y1="290" x2="80" y2="60" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="440" y="295" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Module Component w</text>
    <text x="55" y="65" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Learnable Bias (b) b</text>

    <!-- Concentric Elliptical Contours of MSE -->
    <ellipse cx="260" cy="165" rx="170" ry="95" fill="none" stroke="#f1f5f9" stroke-width="8"/>
    <ellipse cx="260" cy="165" rx="170" ry="95" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="400" y="115" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">MSE = 8.0</text>

    <ellipse cx="260" cy="165" rx="125" ry="70" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="360" y="135" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">MSE = 4.0</text>

    <ellipse cx="260" cy="165" rx="80" ry="45" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <text x="315" y="150" font-family="system-ui, sans-serif" font-size="10" fill="#475569">MSE = 2.0</text>

    <ellipse cx="260" cy="165" rx="40" ry="22" fill="none" stroke="#3b82f6" stroke-width="1.8"/>

    <!-- Global Minimum Center (w*, b*) -->
    <circle cx="260" cy="165" r="5" fill="#16a34a"/>
    <text x="260" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#15803d">Module Component (w*, b*)</text>

    <!-- Initial Point (w0, b0) = (0, 0) -->
    <circle cx="110" cy="245" r="6" fill="#dc2626"/>
    <text x="110" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dc2626">Module Component (0, 0)</text>

    <!-- Gradient Vector (Ascent) -->
    <line x1="110" y1="245" x2="80" y2="275" stroke="#dc2626" stroke-width="2" stroke-dasharray="3" marker-end="url(#arr-red-opt)"/>
    <text x="65" y="295" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#dc2626">∇L (Module Component)</text>

    <!-- Descent Trajectory (Iterations) -->
    <path d="M 110 245 L 155 215 L 195 190 L 230 175 L 255 167" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr-green-opt)"/>
    <circle cx="155" cy="215" r="3.5" fill="#16a34a"/>
    <circle cx="195" cy="190" r="3.5" fill="#16a34a"/>
    <circle cx="230" cy="175" r="3.5" fill="#16a34a"/>

    <!-- Bottom Legend -->
    <rect x="30" y="312" width="430" height="36" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="245" y="334" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#15803d">Module Component: Module Component (-η·∇L)</text>
  </g>

  <!-- Right Card: 5 Invariant Steps of Learning -->
  <g transform="translate(545, 95)">
    <rect width="475" height="360" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-sh-2)"/>
    <rect width="475" height="36" rx="16" fill="#f8fafc"/>
    <text x="237" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e293b">Module Component 5 Module Component</text>

    <!-- Step 1 -->
    <g transform="translate(25, 52)">
      <rect width="425" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="18" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af">1. Module Component (Forward Prediction):</text>
      <text x="18" y="39" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0f172a">ŷ = wx + b  (Module Component ŷ = W·X + B Module Component)</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(25, 110)">
      <rect width="425" height="48" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
      <text x="18" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#be123c">2. Module Component Residual Error (y_hat - y) (Residual Error):</text>
      <text x="18" y="39" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0f172a">eᵢ = ŷᵢ - yᵢ  (Module Component)</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(25, 168)">
      <rect width="425" height="48" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
      <text x="18" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c">3. Module Component (Empirical Risk / MSE):</text>
      <text x="18" y="39" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0f172a">L = (1/N) ∑ eᵢ²  (Module Component)</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(25, 226)">
      <rect width="425" height="48" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
      <text x="18" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#7e22ce">4. Module Component (Gradient Computation):</text>
      <text x="18" y="39" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0f172a">∇_w L = 2 · moy(e · x)  Module Component  ∇_b L = 2 · moy(e)</text>
    </g>

    <!-- Step 5 -->
    <g transform="translate(25, 284)">
      <rect width="425" height="52" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="18" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#15803d">5. Module Component (Parameter Optimization Step):</text>
      <text x="18" y="41" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534">w ← w - η·∇_w L    Module Component    b ← b - η·∇_b L</text>
    </g>
  </g>
</svg>

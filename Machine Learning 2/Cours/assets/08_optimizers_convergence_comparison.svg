<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 500" width="100%" height="100%" style="background:transparent;">
  <defs>
    <filter id="optShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="optArrow" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#0f172a" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="475" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Optimization Dynamics: Gradient Descent Variants &amp; Modern Optimizers</text>
  <text x="475" y="54" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#475569">Convergence Trajectories on Ravine Loss Landscapes (SGD vs Momentum vs RMSProp vs Adam)</text>

  <!-- Outer Card -->
  <rect x="40" y="70" width="870" height="410" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#optShadow)"/>

  <!-- Left Side: Loss Contour Surface with Trajectories (width 440) -->
  <g transform="translate(60, 90)">
    <rect x="0" y="0" width="410" height="370" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="205" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Loss Surface Contours (Ravine Landscape)</text>

    <!-- Elliptical Contours representing ravine -->
    <ellipse cx="280" cy="210" rx="160" ry="120" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <ellipse cx="280" cy="210" rx="120" ry="85" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <ellipse cx="280" cy="210" rx="80" ry="55" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <ellipse cx="280" cy="210" rx="40" ry="25" fill="none" stroke="#64748b" stroke-width="2"/>
    <!-- Global Minimum Star -->
    <circle cx="280" cy="210" r="5" fill="#dc2626"/>
    <text x="280" y="228" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#dc2626">Minimum W*</text>

    <!-- Initial Point W0 -->
    <circle cx="45" cy="110" r="5" fill="#0f172a"/>
    <text x="45" y="98" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0f172a">Start W₀</text>

    <!-- 1. Standard SGD Trajectory (Blue): Severe vertical oscillation -->
    <path d="M 45 110 L 80 270 L 115 130 L 150 255 L 180 150 L 205 235 L 230 175 L 250 220" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 2"/>

    <!-- 2. Momentum (Green): Dampened oscillation, accelerated horizontal -->
    <path d="M 45 110 Q 75 220 110 190 Q 155 160 195 210 Q 235 215 270 210" fill="none" stroke="#10b981" stroke-width="2.5"/>

    <!-- 3. RMSProp (Orange): Rescaled gradients -->
    <path d="M 45 110 L 100 160 L 150 185 L 200 200 L 250 208 L 275 210" fill="none" stroke="#f59e0b" stroke-width="2.5"/>

    <!-- 4. Adam (Purple): Smooth, direct, optimal convergence -->
    <path d="M 45 110 Q 110 150 180 185 Q 235 205 278 210" fill="none" stroke="#8b5cf6" stroke-width="3"/>

    <!-- Trajectory Legend inside chart -->
    <rect x="15" y="275" width="200" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="25" y1="292" x2="50" y2="292" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="58" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#1e40af">SGD (High Oscillation)</text>

    <line x1="25" y1="312" x2="50" y2="312" stroke="#10b981" stroke-width="2.5"/>
    <text x="58" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#065f46">SGD + Momentum</text>

    <line x1="25" y1="332" x2="50" y2="332" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="58" y="336" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#b45309">RMSProp (Adaptive Step)</text>

    <line x1="25" y1="352" x2="50" y2="352" stroke="#8b5cf6" stroke-width="3"/>
    <text x="58" y="356" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#6d28d9">Adam (Fast &amp; Robust)</text>
  </g>

  <!-- Right Side: Optimizer Equations and Summary Cards (width 400) -->
  <g transform="translate(490, 90)">
    
    <!-- Optimizer 1: SGD + Momentum -->
    <rect x="0" y="0" width="400" height="110" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.2"/>
    <text x="15" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#065f46">1. SGD with Momentum (Polyak, 1964)</text>
    <text x="15" y="44" font-family="monospace" font-size="11" fill="#065f46">v_t = β · v_{t-1} + (1 - β) · ∇ℒ(w_t)</text>
    <text x="15" y="66" font-family="monospace" font-size="11" fill="#065f46">w_{t+1} = w_t - η · v_t</text>
    <text x="15" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#334155">• Inertia velocity (β ≈ 0.9) dampens transversal oscillations.</text>

    <!-- Optimizer 2: RMSProp -->
    <rect x="0" y="125" width="400" height="110" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="15" y="147" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#92400e">2. RMSProp (Hinton, 2012)</text>
    <text x="15" y="169" font-family="monospace" font-size="11" fill="#92400e">s_t = β₂ · s_{t-1} + (1 - β₂) · (∇ℒ(w_t))²</text>
    <text x="15" y="191" font-family="monospace" font-size="11" fill="#92400e">w_{t+1} = w_t - η / (√(s_t) + ε) · ∇ℒ(w_t)</text>
    <text x="15" y="219" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#334155">• Scales learning rate by square root of moving average gradient.</text>

    <!-- Optimizer 3: Adam -->
    <rect x="0" y="250" width="400" height="120" rx="6" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
    <text x="15" y="272" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#6b21a8">3. Adam: Adaptive Moment Estimation (Kingma &amp; Ba, 2014)</text>
    <text x="15" y="294" font-family="monospace" font-size="10.5" fill="#6b21a8">m_t = β₁ m_{t-1} + (1-β₁) g_t  ;  v_t = β₂ v_{t-1} + (1-β₂) g_t²</text>
    <text x="15" y="316" font-family="monospace" font-size="10.5" fill="#6b21a8">m̂_t = m_t / (1-β₁ᵗ)  ;  v̂_t = v_t / (1-β₂ᵗ)  [Bias Correction]</text>
    <text x="15" y="338" font-family="monospace" font-size="11" font-weight="700" fill="#7e22ce">w_{t+1} = w_t - η / (√(v̂_t) + ε) · m̂_t</text>
    <text x="15" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#059669">Default Gold Standard: η=0.001, β₁=0.9, β₂=0.999, ε=10⁻⁸</text>
  </g>
</svg>

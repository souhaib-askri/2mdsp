<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%" style="background:transparent;">
  <defs>
    <filter id="bpShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="fwdMark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb" />
    </marker>
    <marker id="backMark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e11d48" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="475" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Backpropagation Computational Graph &amp; Chain Rule Dynamics</text>
  <text x="475" y="54" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#475569">Forward Propagation (Inference) vs Backward Propagation (Gradient Error Flow)</text>

  <!-- Outer Card -->
  <rect x="40" y="70" width="870" height="390" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#bpShadow)"/>

  <!-- Top Legend -->
  <g transform="translate(260, 95)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#2563eb" stroke-width="3" marker-end="url(#fwdMark)"/>
    <text x="50" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e40af">Forward Pass (Activations a^[l])</text>

    <line x1="260" y1="0" x2="300" y2="0" stroke="#e11d48" stroke-width="3" marker-end="url(#backMark)"/>
    <text x="310" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#be123c">Backward Pass (Error Deltas δ^[l])</text>
  </g>

  <!-- Node 1: Layer l-1 Activation a^[l-1] -->
  <g transform="translate(70, 150)">
    <rect x="0" y="0" width="130" height="90" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="65" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1e40af">Layer [l-1]</text>
    <text x="65" y="52" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#2563eb">a^[l-1]</text>
    <text x="65" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Previous Output</text>
  </g>

  <!-- Forward arrow 1: W^[l], b^[l] -->
  <path d="M 205 180 L 265 180" stroke="#2563eb" stroke-width="2.5" marker-end="url(#fwdMark)"/>
  <text x="235" y="170" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#1e40af">W^[l], b^[l]</text>

  <!-- Node 2: Linear Combination z^[l] -->
  <g transform="translate(275, 150)">
    <rect x="0" y="0" width="145" height="90" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
    <text x="72" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#065f46">Affine Map</text>
    <text x="72" y="52" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#059669">z^[l]=W^[l]a^[l-1]+b^[l]</text>
    <text x="72" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Pre-activation Logit</text>
  </g>

  <!-- Forward arrow 2: phi^[l] -->
  <path d="M 425 180 L 485 180" stroke="#2563eb" stroke-width="2.5" marker-end="url(#fwdMark)"/>
  <text x="455" y="170" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#1e40af">ϕ^[l](·)</text>

  <!-- Node 3: Activation a^[l] -->
  <g transform="translate(495, 150)">
    <rect x="0" y="0" width="130" height="90" rx="8" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
    <text x="65" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#6b21a8">Layer [l]</text>
    <text x="65" y="52" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#7e22ce">a^[l]=ϕ(z^[l])</text>
    <text x="65" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Post-activation</text>
  </g>

  <!-- Forward arrow 3: to next layers -->
  <path d="M 630 180 L 690 180" stroke="#2563eb" stroke-width="2.5" marker-end="url(#fwdMark)"/>
  <text x="660" y="170" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">... layers</text>

  <!-- Node 4: Loss Function L(y, y_hat) -->
  <g transform="translate(700, 150)">
    <rect x="0" y="0" width="170" height="90" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="85" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#991b1b">Loss Layer [L]</text>
    <text x="85" y="52" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#dc2626">ℒ(y, a^[L])</text>
    <text x="85" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Cross-Entropy Loss</text>
  </g>

  <!-- ================= BACKWARD PATH (BOTTOM) ================= -->

  <!-- Backward arrow 1: delta^[L] = a^[L] - y -->
  <path d="M 700 280 L 635 280" stroke="#e11d48" stroke-width="2.5" marker-end="url(#backMark)"/>
  <text x="670" y="270" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#e11d48">δ^[L] = a^[L] - y</text>

  <!-- Backward delta^[l+1] into delta^[l] -->
  <path d="M 490 280 L 425 280" stroke="#e11d48" stroke-width="2.5" marker-end="url(#backMark)"/>
  <text x="460" y="270" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#e11d48">W^[l+1]ᵀ δ^[l+1]</text>

  <!-- Box for Delta l calculation -->
  <g transform="translate(250, 260)">
    <rect x="0" y="0" width="170" height="75" rx="6" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="85" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#9f1239">Error Delta Vector (δ^[l])</text>
    <text x="85" y="46" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#e11d48">δ^[l] = (W^[l+1]ᵀδ^[l+1]) ⊙ ϕ'(z^[l])</text>
    <text x="85" y="64" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#881337">Hadamard Element-wise Product ⊙</text>
  </g>

  <!-- Parameter Gradients Bottom Box -->
  <g transform="translate(70, 360)">
    <rect x="0" y="0" width="800" height="75" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="400" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Exact Mathematical Gradients for Optimization Update</text>
    
    <text x="180" y="52" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#1e40af">∂ℒ/∂W^[l] = δ^[l] · (a^[l-1])ᵀ</text>
    <line x1="380" y1="36" x2="380" y2="68" stroke="#cbd5e1" stroke-width="1"/>
    
    <text x="500" y="52" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#1e40af">∂ℒ/∂b^[l] = δ^[l]</text>
    <line x1="610" y1="36" x2="610" y2="68" stroke="#cbd5e1" stroke-width="1"/>

    <text x="715" y="52" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#059669">W^[l] ← W^[l] - η(∂ℒ/∂W^[l])</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 520" width="100%" height="100%" style="background:transparent;">
  <defs>
    <filter id="mlpShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="fwdArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="475" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Multi-Layer Perceptron (MLP) Architecture for MNIST</text>
  <text x="475" y="54" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#475569">Feedforward Layer Stacking: Linear Affine Transform + Non-Linear Activation</text>

  <!-- Layers Container Box -->
  <rect x="40" y="70" width="870" height="430" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#mlpShadow)"/>

  <!-- Layer 0: Input Layer (x in R^784) -->
  <g transform="translate(70, 95)">
    <rect x="0" y="0" width="150" height="385" rx="8" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="150" height="32" rx="8" fill="#dbeafe"/>
    <text x="75" y="21" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1e40af">Input Layer (a^[0])</text>
    <text x="75" y="48" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#2563eb">x ∈ ℝ⁷⁸⁴ (28x28)</text>

    <!-- Neurons representation -->
    <circle cx="75" cy="85" r="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="75" y="89" text-anchor="middle" font-family="monospace" font-size="10" fill="#1e40af">x₁</text>

    <circle cx="75" cy="135" r="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="75" y="139" text-anchor="middle" font-family="monospace" font-size="10" fill="#1e40af">x₂</text>

    <circle cx="75" cy="185" r="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="75" y="189" text-anchor="middle" font-family="monospace" font-size="10" fill="#1e40af">x₃</text>

    <!-- Ellipsis -->
    <text x="75" y="235" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#64748b">⋮</text>

    <circle cx="75" cy="285" r="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="75" y="289" text-anchor="middle" font-family="monospace" font-size="10" fill="#1e40af">x₇₈₄</text>

    <text x="75" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#475569">Flattened MNIST</text>
    <text x="75" y="356" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#475569">Grayscale Pixels</text>
  </g>

  <!-- Weight Matrix W^[1] and Bias b^[1] -->
  <g transform="translate(230, 240)">
    <path d="M 0 0 L 50 0" stroke="#2563eb" stroke-width="2" marker-end="url(#fwdArrow)"/>
    <text x="25" y="-12" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#1e40af">W^[1], b^[1]</text>
    <text x="25" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748b">Linear Map</text>
  </g>

  <!-- Layer 1: Hidden Layer 1 (ReLU) -->
  <g transform="translate(290, 95)">
    <rect x="0" y="0" width="165" height="385" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="165" height="32" rx="8" fill="#d1fae5"/>
    <text x="82" y="21" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#065f46">Hidden Layer 1 (a^[1])</text>
    <text x="82" y="48" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#059669">n^[1] = 128 Neurons</text>

    <!-- Neurons representation -->
    <circle cx="82" cy="85" r="18" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="82" y="89" text-anchor="middle" font-family="monospace" font-size="10" fill="#065f46">h₁¹</text>

    <circle cx="82" cy="135" r="18" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="82" y="139" text-anchor="middle" font-family="monospace" font-size="10" fill="#065f46">h₂¹</text>

    <circle cx="82" cy="185" r="18" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="82" y="189" text-anchor="middle" font-family="monospace" font-size="10" fill="#065f46">h₃¹</text>

    <!-- Ellipsis -->
    <text x="82" y="235" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#64748b">⋮</text>

    <circle cx="82" cy="285" r="18" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="82" y="289" text-anchor="middle" font-family="monospace" font-size="10" fill="#065f46">h₁₂₈¹</text>

    <rect x="15" y="325" width="135" height="42" rx="4" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
    <text x="82" y="342" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#065f46">z^[1] = W^[1]x + b^[1]</text>
    <text x="82" y="358" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#059669">a^[1] = ReLU(z^[1])</text>
  </g>

  <!-- Weight Matrix W^[2] and Bias b^[2] -->
  <g transform="translate(465, 240)">
    <path d="M 0 0 L 50 0" stroke="#10b981" stroke-width="2" marker-end="url(#fwdArrow)"/>
    <text x="25" y="-12" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#065f46">W^[2], b^[2]</text>
    <text x="25" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748b">Dense Map</text>
  </g>

  <!-- Layer 2: Hidden Layer 2 (ReLU) -->
  <g transform="translate(525, 95)">
    <rect x="0" y="0" width="165" height="385" rx="8" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="0" y="0" width="165" height="32" rx="8" fill="#f3e8ff"/>
    <text x="82" y="21" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#6b21a8">Hidden Layer 2 (a^[2])</text>
    <text x="82" y="48" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#7e22ce">n^[2] = 64 Neurons</text>

    <!-- Neurons representation -->
    <circle cx="82" cy="85" r="18" fill="#ffffff" stroke="#a855f7" stroke-width="2"/>
    <text x="82" y="89" text-anchor="middle" font-family="monospace" font-size="10" fill="#6b21a8">h₁²</text>

    <circle cx="82" cy="135" r="18" fill="#ffffff" stroke="#a855f7" stroke-width="2"/>
    <text x="82" y="139" text-anchor="middle" font-family="monospace" font-size="10" fill="#6b21a8">h₂²</text>

    <circle cx="82" cy="185" r="18" fill="#ffffff" stroke="#a855f7" stroke-width="2"/>
    <text x="82" y="189" text-anchor="middle" font-family="monospace" font-size="10" fill="#6b21a8">h₃²</text>

    <!-- Ellipsis -->
    <text x="82" y="235" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#64748b">⋮</text>

    <circle cx="82" cy="285" r="18" fill="#ffffff" stroke="#a855f7" stroke-width="2"/>
    <text x="82" y="289" text-anchor="middle" font-family="monospace" font-size="10" fill="#6b21a8">h₆₄²</text>

    <rect x="15" y="325" width="135" height="42" rx="4" fill="#ffffff" stroke="#e9d5ff" stroke-width="1"/>
    <text x="82" y="342" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#6b21a8">z^[2] = W^[2]a^[1] + b^[2]</text>
    <text x="82" y="358" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#7e22ce">a^[2] = ReLU(z^[2])</text>
  </g>

  <!-- Weight Matrix W^[3] and Bias b^[3] -->
  <g transform="translate(700, 240)">
    <path d="M 0 0 L 45 0" stroke="#a855f7" stroke-width="2" marker-end="url(#fwdArrow)"/>
    <text x="22" y="-12" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#6b21a8">W^[3], b^[3]</text>
    <text x="22" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748b">Logits Map</text>
  </g>

  <!-- Layer 3: Output Layer (Softmax 10 classes) -->
  <g transform="translate(755, 95)">
    <rect x="0" y="0" width="140" height="385" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="0" y="0" width="140" height="32" rx="8" fill="#fee2e2"/>
    <text x="70" y="21" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#991b1b">Output Layer (ŷ)</text>
    <text x="70" y="48" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#dc2626">K = 10 Classes</text>

    <!-- Neurons representation -->
    <circle cx="70" cy="85" r="16" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <text x="70" y="89" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#991b1b">p₀</text>

    <circle cx="70" cy="135" r="16" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <text x="70" y="139" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#991b1b">p₁</text>

    <!-- Ellipsis -->
    <text x="70" y="185" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#64748b">⋮</text>

    <circle cx="70" cy="235" r="16" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <text x="70" y="239" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#991b1b">p₇</text>

    <circle cx="70" cy="285" r="16" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <text x="70" y="289" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#991b1b">p₉</text>

    <rect x="10" y="325" width="120" height="42" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
    <text x="70" y="342" text-anchor="middle" font-family="monospace" font-size="9" font-weight="600" fill="#991b1b">z^[3] = W^[3]a^[2]+b^[3]</text>
    <text x="70" y="358" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#dc2626">ŷ = Softmax(z^[3])</text>
  </g>
</svg>

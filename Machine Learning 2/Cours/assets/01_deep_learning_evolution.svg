<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 480" width="100%" height="100%" style="background:transparent;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f46e5" />
    </marker>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="525" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Architectural Evolution: Linear Neuron to Deep Neural Networks</text>
  <text x="525" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#475569">Transition from Elementary Linear Unit to Multi-Layer Deep Architectures</text>

  <!-- Left Card: Simple Linear Neuron (Model in TP1) -->
  <g transform="translate(30, 95)">
    <rect width="470" height="360" rx="16" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#card-shadow)"/>
    <rect width="470" height="36" rx="16" fill="#eff6ff"/>
    <text x="235" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e40af">1. Elementary Linear Neuron (Single Unit)</text>

    <!-- Subtitle tag -->
    <rect x="145" y="48" width="180" height="22" rx="6" fill="#dbeafe"/>
    <text x="235" y="63" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">Single Input • 2 Parameters (w, b)</text>

    <!-- Diagram inside left card -->
    <!-- Input node -->
    <circle cx="70" cy="150" r="26" fill="#f8fafc" stroke="#3b82f6" stroke-width="2"/>
    <text x="70" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">x</text>
    <text x="70" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#475569">Input Feature (x)</text>

    <!-- Arrow with weight -->
    <line x1="96" y1="150" x2="190" y2="150" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-blue)"/>
    <text x="145" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">× w (Weight)</text>

    <!-- Neuron Summation &amp; Identity -->
    <circle cx="230" cy="150" r="38" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="230" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Σ | φ</text>
    <text x="230" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#1e40af">wx + b</text>

    <!-- Bias arrow entering neuron -->
    <line x1="230" y1="80" x2="230" y2="110" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-blue)"/>
    <text x="230" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#15803d">+ b (Bias)</text>

    <!-- Output arrow -->
    <line x1="270" y1="150" x2="360" y2="150" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-blue)"/>

    <!-- Output node -->
    <circle cx="395" cy="150" r="26" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
    <text x="395" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">ŷ</text>
    <text x="395" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#475569">Linear Output (y_hat)</text>

    <!-- Summary Box -->
    <rect x="25" y="235" width="420" height="105" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="40" y="260" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">• Mathematical Model: y_hat = phi(wx + b) with phi(z) = z</text>
    <text x="40" y="284" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#334155">• Decision Surface: Strictly Linear Model</text>
    <text x="40" y="306" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#334155">• Capacity: Limited to direct proportional relationships</text>
    <text x="40" y="328" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#2563eb">• Primary Task: Simple Univariate Linear Regression</text>
  </g>

  <!-- Right Card: Deep Neural Network Architecture -->
  <g transform="translate(545, 95)">
    <rect width="475" height="360" rx="16" fill="#ffffff" stroke="#6366f1" stroke-width="2" filter="url(#card-shadow)"/>
    <rect width="475" height="36" rx="16" fill="#eef2ff"/>
    <text x="237" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#4338ca">2. Deep Neural Networks (Multi-Layer Architecture)</text>

    <!-- Subtitle tag -->
    <rect x="135" y="48" width="205" height="22" rx="6" fill="#e0e7ff"/>
    <text x="237" y="63" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#3730a3">Multi-Input • Hidden Layers • Non-Linear Activations</text>

    <!-- Input Layer nodes -->
    <g transform="translate(45, 90)">
      <circle cx="20" cy="30" r="14" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.8"/>
      <text x="20" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a">x₁</text>
      <circle cx="20" cy="70" r="14" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.8"/>
      <text x="20" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a">x₂</text>
      <circle cx="20" cy="110" r="14" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.8"/>
      <text x="20" y="114" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a">xₙ</text>
      <text x="20" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#475569">Entrées</text>
    </g>

    <!-- Hidden Layer 1 nodes -->
    <g transform="translate(155, 90)">
      <circle cx="20" cy="15" r="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
      <circle cx="20" cy="50" r="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
      <circle cx="20" cy="85" r="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
      <circle cx="20" cy="120" r="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
      <text x="20" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#4338ca">C. Cachée 1</text>
    </g>

    <!-- Hidden Layer 2 nodes -->
    <g transform="translate(265, 90)">
      <circle cx="20" cy="25" r="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
      <circle cx="20" cy="65" r="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
      <circle cx="20" cy="105" r="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
      <text x="20" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#4338ca">C. Cachée 2</text>
    </g>

    <!-- Output Layer -->
    <g transform="translate(375, 90)">
      <circle cx="20" cy="65" r="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
      <text x="20" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">ŷ</text>
      <text x="20" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#15803d">Sortie</text>
    </g>

    <!-- Synaptic connection lines between layers -->
    <!-- Input to Hidden 1 -->
    <line x1="80" y1="120" x2="160" y2="105" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="80" y1="120" x2="160" y2="140" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="80" y1="160" x2="160" y2="140" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="80" y1="160" x2="160" y2="175" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="80" y1="200" x2="160" y2="175" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="80" y1="200" x2="160" y2="210" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Hidden 1 to Hidden 2 -->
    <line x1="190" y1="105" x2="270" y2="115" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="190" y1="140" x2="270" y2="155" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="190" y1="175" x2="270" y2="155" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="190" y1="210" x2="270" y2="195" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Hidden 2 to Output -->
    <line x1="300" y1="115" x2="375" y2="155" stroke="#818cf8" stroke-width="1.5"/>
    <line x1="300" y1="155" x2="375" y2="155" stroke="#818cf8" stroke-width="1.5"/>
    <line x1="300" y1="195" x2="375" y2="155" stroke="#818cf8" stroke-width="1.5"/>

    <!-- Summary Box -->
    <rect x="25" y="245" width="425" height="95" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="40" y="268" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">• Mathematical Model: Composition of non-linear layered functions</text>
    <text x="40" y="290" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#334155">• Universal Approximation: Capable of learning arbitrary complex manifolds</text>
    <text x="40" y="312" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#334155">• Optimization: End-to-end Backpropagation &amp; Gradient Descent</text>
    <text x="40" y="332" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#4338ca">• Shared Principle: Error evaluation &amp; iterative backward weight updates</text>
  </g>
</svg>

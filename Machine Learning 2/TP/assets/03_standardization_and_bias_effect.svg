<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 480" width="100%" height="100%" style="background:transparent;">
  <defs>
    <filter id="soft-shadow-3" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="525" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Geometric Impact of Bias &amp; Standardization</text>
  <text x="525" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#475569">Module Component</text>

  <!-- Left Side: Bias Effect (Module Component) -->
  <g transform="translate(30, 95)">
    <rect width="475" height="360" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#soft-shadow-3)"/>
    <rect width="475" height="36" rx="16" fill="#f8fafc"/>
    <text x="237" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e293b">Module Component: Module Component Learnable Bias (b) (Biais b)</text>

    <!-- Axes -->
    <line x1="60" y1="260" x2="430" y2="260" stroke="#94a3b8" stroke-width="1.5"/> <!-- X Axis -->
    <line x1="90" y1="270" x2="90" y2="70" stroke="#94a3b8" stroke-width="1.5"/>   <!-- Y Axis -->
    <text x="430" y="275" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">x</text>
    <text x="75" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">y</text>
    <text x="80" y="275" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b">(0,0)</text>

    <!-- Data points cloud (shifted up) -->
    <circle cx="160" cy="180" r="3.5" fill="#64748b" opacity="0.6"/>
    <circle cx="190" cy="165" r="3.5" fill="#64748b" opacity="0.6"/>
    <circle cx="220" cy="155" r="3.5" fill="#64748b" opacity="0.6"/>
    <circle cx="250" cy="140" r="3.5" fill="#64748b" opacity="0.6"/>
    <circle cx="280" cy="130" r="3.5" fill="#64748b" opacity="0.6"/>
    <circle cx="310" cy="115" r="3.5" fill="#64748b" opacity="0.6"/>
    <circle cx="340" cy="110" r="3.5" fill="#64748b" opacity="0.6"/>
    <circle cx="370" cy="95" r="3.5" fill="#64748b" opacity="0.6"/>

    <!-- Line 1: No Bias (constrained to 0,0) -->
    <line x1="90" y1="260" x2="400" y2="120" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6 3"/>
    <text x="320" y="150" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dc2626">Module Component: ŷ = wx</text>
    <text x="320" y="165" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#991b1b">(Module Component 0,0)</text>

    <!-- Line 2: With Bias (free intercept b) -->
    <line x1="90" y1="210" x2="400" y2="85" stroke="#16a34a" stroke-width="2.5"/>
    <text x="210" y="90" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#15803d">Module Component: ŷ = wx + b</text>
    <!-- Intercept marker b -->
    <circle cx="90" cy="210" r="4.5" fill="#15803d"/>
    <text x="100" y="212" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#15803d">b (Module Component)</text>

    <!-- Card Note -->
    <rect x="25" y="285" width="425" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="237" y="306" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">• Module Component (Contrainte rigide)</text>
    <text x="237" y="324" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#475569">• Module Component b Module ComponentLearnable Bias (b) Module Component MSE Module Component MAE Module Component</text>
  </g>

  <!-- Right Side: Standardization Effect (Loss Surface Contour) -->
  <g transform="translate(545, 95)">
    <rect width="475" height="360" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#soft-shadow-3)"/>
    <rect width="475" height="36" rx="16" fill="#f8fafc"/>
    <text x="237" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e293b">Module Component: Module Component (Standardization Z-Score)</text>

    <!-- Sub-panel A: Non-standardized (Elongated ellipses) -->
    <g transform="translate(20, 50)">
      <text x="105" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dc2626">Module Component (Non standardisé)</text>
      <!-- Ellipses -->
      <ellipse cx="105" cy="110" rx="90" ry="32" fill="none" stroke="#fca5a5" stroke-width="1.5"/>
      <ellipse cx="105" cy="110" rx="65" ry="22" fill="none" stroke="#f87171" stroke-width="1.5"/>
      <ellipse cx="105" cy="110" rx="35" ry="12" fill="none" stroke="#ef4444" stroke-width="1.5"/>
      <circle cx="105" cy="110" r="3" fill="#0f172a"/>
      <!-- Zigzag path -->
      <path d="M 40 92 L 65 125 L 80 98 L 92 118 L 102 108" fill="none" stroke="#dc2626" stroke-width="1.8"/>
      <text x="105" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#991b1b">Module Component η Module Component (0.0001)</text>
    </g>

    <!-- Divider line -->
    <line x1="240" y1="55" x2="240" y2="240" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4"/>

    <!-- Sub-panel B: Standardized (Circular symmetric contours) -->
    <g transform="translate(255, 50)">
      <text x="105" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#16a34a">Module Component (Standardisé Xn)</text>
      <!-- Circles -->
      <ellipse cx="105" cy="110" rx="70" ry="60" fill="none" stroke="#86efac" stroke-width="1.5"/>
      <ellipse cx="105" cy="110" rx="48" ry="42" fill="none" stroke="#4ade80" stroke-width="1.5"/>
      <ellipse cx="105" cy="110" rx="26" ry="22" fill="none" stroke="#22c55e" stroke-width="1.5"/>
      <circle cx="105" cy="110" r="3" fill="#0f172a"/>
      <!-- Direct path to center -->
      <path d="M 48 65 L 75 88 L 95 103 L 105 110" fill="none" stroke="#16a34a" stroke-width="2"/>
      <text x="105" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#15803d">Module Component (η = 0.05)</text>
    </g>

    <!-- Card Note -->
    <rect x="25" y="285" width="425" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="237" y="306" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">• Module Component 0 Module Component 1: Xn = (X - μ) / σ</text>
    <text x="237" y="324" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#475569">• Module Component</text>
  </g>
</svg>

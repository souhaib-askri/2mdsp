<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background:transparent;">
  <defs>
    <filter id="cardShadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Evolution of Language Modeling Architectures</text>
  <text x="500" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">From statistical n-grams to trillion-parameter multimodal foundation models</text>

  <!-- Timeline horizontal spine -->
  <line x1="60" y1="95" x2="940" y2="95" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

  <!-- Milestone 1: N-Grams -->
  <circle cx="110" cy="95" r="9" fill="#64748b" stroke="#ffffff" stroke-width="3"/>
  <rect x="25" y="120" width="170" height="470" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="25" y="120" width="170" height="34" rx="10" fill="#e2e8f0"/>
  <text x="110" y="142" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">1. N-Gram Models</text>
  <text x="110" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">1948 - 1990s</text>
  
  <text x="35" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Core Concept:</text>
  <text x="35" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Statistical frequency</text>
  <text x="35" y="234" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Markovian assumption</text>
  <text x="35" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Conditional prob:</text>
  <text x="38" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0284c7">P(w|w&#8331;&#8331;&#8321;, w&#8331;&#8331;&#8322;)</text>

  <text x="35" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#15803d">Strengths:</text>
  <text x="35" y="313" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Fast &amp; simple</text>
  <text x="35" y="329" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; No GPU needed</text>
  <text x="35" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Good for short terms</text>

  <text x="35" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">Limitations:</text>
  <text x="35" y="393" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; No semantic understanding</text>
  <text x="35" y="409" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; High data sparsity</text>
  <text x="35" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Rigid n-context window</text>
  
  <rect x="35" y="445" width="150" height="60" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="42" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0f172a">Example:</text>
  <text x="42" y="482" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569">"Thank you very" &#8594; "much"</text>
  <text x="42" y="497" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569">Can't link long sentences</text>

  <!-- Milestone 2: Embeddings -->
  <circle cx="305" cy="95" r="9" fill="#0284c7" stroke="#ffffff" stroke-width="3"/>
  <rect x="220" y="120" width="170" height="470" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="220" y="120" width="170" height="34" rx="10" fill="#e0f2fe"/>
  <text x="305" y="142" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0369a1">2. Word Embeddings</text>
  <text x="305" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0369a1">2013 - 2015</text>

  <text x="230" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Core Concept:</text>
  <text x="230" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Dense vector spaces</text>
  <text x="230" y="234" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Word2Vec (CBOW / Skip)</text>
  <text x="230" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; GloVe co-occurrence</text>
  <text x="230" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#0284c7">&#8477;d continuous space</text>

  <text x="230" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#15803d">Strengths:</text>
  <text x="230" y="313" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Semantic analogies</text>
  <text x="230" y="329" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Solves sparsity</text>
  <text x="230" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Generalizable vectors</text>

  <text x="230" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">Limitations:</text>
  <text x="230" y="393" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Context-independent</text>
  <text x="230" y="409" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; 1 vector per word</text>
  <text x="230" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Ignores word order</text>

  <rect x="230" y="445" width="150" height="60" rx="6" fill="#e0f2fe" stroke="#bae6fd"/>
  <text x="237" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0369a1">Analogy Math:</text>
  <text x="237" y="482" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#0f172a">King - Man + Woman</text>
  <text x="237" y="497" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#0369a1">= Queen</text>

  <!-- Milestone 3: RNN & LSTM -->
  <circle cx="500" cy="95" r="9" fill="#7c3aed" stroke="#ffffff" stroke-width="3"/>
  <rect x="415" y="120" width="170" height="470" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="415" y="120" width="170" height="34" rx="10" fill="#f3e8ff"/>
  <text x="500" y="142" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#6b21a8">3. RNN &amp; LSTM</text>
  <text x="500" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#6b21a8">2014 - 2016</text>

  <text x="425" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Core Concept:</text>
  <text x="425" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Recurrent state h(t)</text>
  <text x="425" y="234" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Temporal feedback</text>
  <text x="425" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; LSTM Gated cells:</text>
  <text x="428" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#7c3aed">forget, input, output</text>

  <text x="425" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#15803d">Strengths:</text>
  <text x="425" y="313" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Variable seq length</text>
  <text x="425" y="329" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Shared weights</text>
  <text x="425" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Temporal context</text>

  <text x="425" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">Limitations:</text>
  <text x="425" y="393" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Vanishing gradients</text>
  <text x="425" y="409" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Sequential bottleneck</text>
  <text x="425" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Cannot parallelize</text>

  <rect x="425" y="445" width="150" height="60" rx="6" fill="#f3e8ff" stroke="#e9d5ff"/>
  <text x="432" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#6b21a8">Seq Bottleneck:</text>
  <text x="432" y="482" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#0f172a">Step-by-step: t1&#8594;t2&#8594;t3</text>
  <text x="432" y="497" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569">Loss of early context</text>

  <!-- Milestone 4: Transformers -->
  <circle cx="695" cy="95" r="9" fill="#059669" stroke="#ffffff" stroke-width="3"/>
  <rect x="610" y="120" width="170" height="470" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="610" y="120" width="170" height="34" rx="10" fill="#dcfce7"/>
  <text x="695" y="142" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#14532d">4. Transformers</text>
  <text x="695" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#14532d">2017</text>

  <text x="620" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Core Concept:</text>
  <text x="620" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Self-Attention (Q, K, V)</text>
  <text x="620" y="234" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Scaled Dot-Product</text>
  <text x="620" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Positional Encoding</text>
  <text x="620" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#059669">&#8226; Fully Parallelizable</text>

  <text x="620" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#15803d">Strengths:</text>
  <text x="620" y="313" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Direct long dependencies</text>
  <text x="620" y="329" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; GPU parallelization</text>
  <text x="620" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Rich contextual vectors</text>

  <text x="620" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">Limitations:</text>
  <text x="620" y="393" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; O(N&#178;) memory/compute</text>
  <text x="620" y="409" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Requires massive data</text>
  <text x="620" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Complex architectures</text>

  <rect x="620" y="445" width="150" height="60" rx="6" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="627" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#14532d">Breakthrough:</text>
  <text x="627" y="482" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#0f172a">"Attention is All You Need"</text>
  <text x="627" y="497" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#166534">BERT &amp; GPT Foundation</text>

  <!-- Milestone 5: Scaled Foundation Models -->
  <circle cx="885" cy="95" r="9" fill="#ea580c" stroke="#ffffff" stroke-width="3"/>
  <rect x="805" y="120" width="170" height="470" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="805" y="120" width="170" height="34" rx="10" fill="#ffedd5"/>
  <text x="890" y="142" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#7c2d12">5. Scaled LLMs</text>
  <text x="890" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#9a3412">2018 - Present</text>

  <text x="815" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Core Concept:</text>
  <text x="815" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Trillion parameter scale</text>
  <text x="815" y="234" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Contexts &#8805; 1M tokens</text>
  <text x="815" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; RLHF &amp; Alignment</text>
  <text x="815" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#c2410c">&#8226; Native Multimodality</text>

  <text x="815" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#15803d">Strengths:</text>
  <text x="815" y="313" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Emergent capabilities</text>
  <text x="815" y="329" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; In-context reasoning</text>
  <text x="815" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Zero/Few-shot solving</text>

  <text x="815" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">Frontier Challenges:</text>
  <text x="815" y="393" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Massive compute costs</text>
  <text x="815" y="409" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Hallucinations</text>
  <text x="815" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">&#8226; Safety &amp; Alignment</text>

  <rect x="815" y="445" width="150" height="60" rx="6" fill="#ffedd5" stroke="#fed7aa"/>
  <text x="822" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#7c2d12">Modern Models:</text>
  <text x="822" y="482" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#0f172a">GPT-4, Claude 3.5, Gemini,</text>
  <text x="822" y="497" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#9a3412">LLaMA 3, DeepSeek V3</text>
</svg>

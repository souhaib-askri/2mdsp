<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="100%" height="100%" style="background:transparent;">
  <defs>
    <filter id="tpShadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="510" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0f172a">TP1: Comparative Evolution of 5 NLP Architectures on IMDB</text>
  <text x="510" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">From Simple Recurrence to Convolutional Speed, Seq2Seq Bottlenecks, and Self-Attention</text>

  <!-- Model 1: SimpleRNN -->
  <g transform="translate(20, 75)">
    <rect x="0" y="0" width="180" height="435" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#tpShadow)"/>
    <rect x="0" y="0" width="180" height="34" rx="10" fill="#fee2e2"/>
    <text x="90" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#991b1b">Mod&#232;le 1: SimpleRNN</text>

    <!-- Layers stack -->
    <rect x="15" y="50" width="150" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="90" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#0f172a">Input (padded 200)</text>

    <rect x="15" y="95" width="150" height="32" rx="6" fill="#e0f2fe" stroke="#38bdf8"/>
    <text x="90" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#0369a1">Embedding (dim=64)</text>

    <rect x="15" y="140" width="150" height="42" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="90" y="158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#991b1b">SimpleRNN (32)</text>
    <text x="90" y="174" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#dc2626">Sequential tanh(Wx+Uh)</text>

    <rect x="15" y="195" width="150" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="90" y="215" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#0f172a">Dense(1, Sigmoid)</text>

    <line x1="90" y1="82" x2="90" y2="95" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="90" y1="127" x2="90" y2="140" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="90" y1="182" x2="90" y2="195" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Properties -->
    <rect x="10" y="245" width="160" height="175" rx="6" fill="#ffffff" stroke="#fecaca"/>
    <text x="18" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#991b1b">&#8226; Characteristic:</text>
    <text x="18" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">Single hidden state</text>
    <text x="18" y="297" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">passed step-by-step.</text>
    <text x="18" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#dc2626">&#8226; Big Failure Mode:</text>
    <text x="18" y="339" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">Vanishing Gradient on</text>
    <text x="18" y="354" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">200 words sequence.</text>
    <text x="18" y="369" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">Struggles above 50%</text>
    <text x="18" y="384" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">accuracy baseline.</text>
    <text x="18" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#991b1b">Speed: Moderate</text>
  </g>

  <!-- Model 2: LSTM -->
  <g transform="translate(220, 75)">
    <rect x="0" y="0" width="180" height="435" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#tpShadow)"/>
    <rect x="0" y="0" width="180" height="34" rx="10" fill="#ede9fe"/>
    <text x="90" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#5b21b6">Mod&#232;le 2: LSTM</text>

    <!-- Layers stack -->
    <rect x="15" y="50" width="150" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="90" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#0f172a">Input (padded 200)</text>

    <rect x="15" y="95" width="150" height="32" rx="6" fill="#e0f2fe" stroke="#38bdf8"/>
    <text x="90" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#0369a1">Embedding (dim=64)</text>

    <rect x="15" y="140" width="150" height="42" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="90" y="158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#5b21b6">LSTM (32)</text>
    <text x="90" y="174" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#7c3aed">Gated: f, i, o + Cell C(t)</text>

    <rect x="15" y="195" width="150" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="90" y="215" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#0f172a">Dense(1, Sigmoid)</text>

    <line x1="90" y1="82" x2="90" y2="95" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="90" y1="127" x2="90" y2="140" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="90" y1="182" x2="90" y2="195" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Properties -->
    <rect x="10" y="245" width="160" height="175" rx="6" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="18" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#5b21b6">&#8226; Characteristic:</text>
    <text x="18" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">Additive cell state</text>
    <text x="18" y="297" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">protects gradients.</text>
    <text x="18" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#15803d">&#8226; High Accuracy:</text>
    <text x="18" y="339" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">Captures 200 words</text>
    <text x="18" y="354" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">sentiment context.</text>
    <text x="18" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#b91c1c">&#8226; Drawback:</text>
    <text x="18" y="392" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">High params, slow</text>
    <text x="18" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#b91c1c">Speed: Slow (Sequential)</text>
  </g>

  <!-- Model 3: CNN 1D -->
  <g transform="translate(420, 75)">
    <rect x="0" y="0" width="180" height="435" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5" filter="url(#tpShadow)"/>
    <rect x="0" y="0" width="180" height="34" rx="10" fill="#e0f2fe"/>
    <text x="90" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0369a1">Mod&#232;le 3: CNN 1D</text>

    <!-- Layers stack -->
    <rect x="15" y="45" width="150" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="90" y="63" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#0f172a">Input (padded 200)</text>

    <rect x="15" y="80" width="150" height="28" rx="6" fill="#e0f2fe" stroke="#38bdf8"/>
    <text x="90" y="98" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0369a1">Embedding (64)</text>

    <rect x="15" y="115" width="150" height="34" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="90" y="131" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0369a1">Conv1D (32, k=5)</text>
    <text x="90" y="144" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#0284c7">Local n-gram filters</text>

    <rect x="15" y="157" width="150" height="28" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="90" y="175" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#0f172a">GlobalMaxPooling1D</text>

    <rect x="15" y="195" width="150" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="90" y="213" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#0f172a">Dense(1, Sigmoid)</text>

    <line x1="90" y1="73" x2="90" y2="80" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="90" y1="108" x2="90" y2="115" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="90" y1="149" x2="90" y2="157" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="90" y1="185" x2="90" y2="195" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Properties -->
    <rect x="10" y="245" width="160" height="175" rx="6" fill="#ffffff" stroke="#bae6fd"/>
    <text x="18" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0369a1">&#8226; Characteristic:</text>
    <text x="18" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">Sliding windows detect</text>
    <text x="18" y="297" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">salient key phrases.</text>
    <text x="18" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#15803d">&#8226; Massive Speedup:</text>
    <text x="18" y="339" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">3x to 5x faster than</text>
    <text x="18" y="354" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">LSTM per epoch due</text>
    <text x="18" y="369" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">to GPU parallelism.</text>
    <text x="18" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569">&#8226; Ignores word order</text>
    <text x="18" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#15803d">Speed: Very Fast</text>
  </g>

  <!-- Model 4: Encoder-Decoder -->
  <g transform="translate(620, 75)">
    <rect x="0" y="0" width="180" height="435" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5" filter="url(#tpShadow)"/>
    <rect x="0" y="0" width="180" height="34" rx="10" fill="#fef3c7"/>
    <text x="90" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#92400e">Mod&#232;le 4: Enc-Dec</text>

    <!-- Layers stack -->
    <rect x="15" y="45" width="150" height="24" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="90" y="61" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#0f172a">Embedding (64)</text>

    <rect x="15" y="75" width="150" height="28" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="90" y="93" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#92400e">Encoder: LSTM(32)</text>

    <rect x="15" y="110" width="150" height="26" rx="5" fill="#fef08a" stroke="#ca8a04"/>
    <text x="90" y="127" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#854d0e">RepeatVector(200)</text>

    <rect x="15" y="143" width="150" height="28" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="90" y="161" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#92400e">Decoder: LSTM(32)</text>

    <rect x="15" y="178" width="150" height="24" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="90" y="194" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#0f172a">GlobalMaxPooling1D</text>

    <rect x="15" y="208" width="150" height="24" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="90" y="224" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#0f172a">Dense(1, Sigmoid)</text>

    <!-- Properties -->
    <rect x="10" y="245" width="160" height="175" rx="6" fill="#ffffff" stroke="#fde68a"/>
    <text x="18" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#92400e">&#8226; Characteristic:</text>
    <text x="18" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">Seq2Seq representation</text>
    <text x="18" y="297" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">without Attention.</text>
    <text x="18" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#b45309">&#8226; Info Bottleneck:</text>
    <text x="18" y="339" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">Compressing entire</text>
    <text x="18" y="354" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">200 words into a single</text>
    <text x="18" y="369" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">fixed vector loses</text>
    <text x="18" y="384" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">fine token nuances.</text>
    <text x="18" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#b45309">Speed: Slow</text>
  </g>

  <!-- Model 5: Mini-Transformer -->
  <g transform="translate(820, 75)">
    <rect x="0" y="0" width="180" height="435" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#tpShadow)"/>
    <rect x="0" y="0" width="180" height="34" rx="10" fill="#dcfce7"/>
    <text x="90" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#14532d">Mod&#232;le 5: Transformer</text>

    <!-- Layers stack -->
    <rect x="15" y="45" width="150" height="24" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="90" y="61" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#0f172a">Embedding (64)</text>

    <rect x="15" y="75" width="150" height="34" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="90" y="91" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#14532d">MultiHeadAttention</text>
    <text x="90" y="103" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#15803d">heads=2, key_dim=64</text>

    <rect x="15" y="115" width="150" height="24" rx="5" fill="#bbf7d0" stroke="#15803d"/>
    <text x="90" y="131" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#14532d">Add (Residual) + Norm</text>

    <rect x="15" y="146" width="150" height="24" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="90" y="162" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#0f172a">GlobalAvgPooling1D</text>

    <rect x="15" y="177" width="150" height="24" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="90" y="193" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#0f172a">Dense(1, Sigmoid)</text>

    <!-- Properties -->
    <rect x="10" y="245" width="160" height="175" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="18" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#14532d">&#8226; Characteristic:</text>
    <text x="18" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">Direct O(1) attention</text>
    <text x="18" y="297" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">between all 200 words.</text>
    <text x="18" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#15803d">&#8226; Optimal Trade-off:</text>
    <text x="18" y="339" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">Parallel GPU compute,</text>
    <text x="18" y="354" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">superior context,</text>
    <text x="18" y="369" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">stable convergence</text>
    <text x="18" y="384" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">with LayerNorm.</text>
    <text x="18" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#15803d">Speed: Fast &amp; Scalable</text>
  </g>
</svg>

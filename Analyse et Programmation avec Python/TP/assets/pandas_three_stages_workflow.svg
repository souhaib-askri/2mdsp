<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:transparent;">
  <defs>
    <!-- Gradients for subtle card accents -->
    <linearGradient id="gradStage1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#dbeafe" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="gradStage2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#dcfce7" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="gradStage3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f3e8ff" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="500" y="45" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#0f172a">PANDAS DATA PIPELINE ARCHITECTURE</text>
  <text x="500" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#475569">Three Essential Stages: 1. Creation  •  2. Manipulation  •  3. Extraction</text>

  <!-- ==================== STAGE 1: CREATION ==================== -->
  <g transform="translate(40, 110)" filter="url(#shadow)">
    <!-- Main Box -->
    <rect width="280" height="520" rx="16" fill="url(#gradStage1)" stroke="#3b82f6" stroke-width="2"/>
    <!-- Stage Header Badge -->
    <rect x="20" y="20" width="240" height="42" rx="8" fill="#2563eb"/>
    <text x="140" y="46" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">STAGE 1: CREATION</text>

    <!-- Sub-heading -->
    <text x="140" y="88" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1e40af">Data Structures &amp; Ingestion</text>

    <!-- Item 1: Series & DataFrame -->
    <rect x="18" y="105" width="244" height="85" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="32" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Core Data Structures</text>
    <text x="32" y="150" font-family="monospace" font-size="11" font-weight="600" fill="#1d4ed8">• pd.Series(data, index)</text>
    <text x="32" y="172" font-family="monospace" font-size="11" font-weight="600" fill="#1d4ed8">• pd.DataFrame(data, cols)</text>

    <!-- Item 2: From In-Memory -->
    <rect x="18" y="205" width="244" height="95" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="32" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">In-Memory Constructors</text>
    <text x="32" y="250" font-family="monospace" font-size="11" font-weight="600" fill="#334155">• Dicts: {col: [values]}</text>
    <text x="32" y="270" font-family="monospace" font-size="11" font-weight="600" fill="#334155">• List of Dicts (JSON format)</text>
    <text x="32" y="290" font-family="monospace" font-size="11" font-weight="600" fill="#334155">• NumPy 2D Arrays</text>

    <!-- Item 3: External IO Readers -->
    <rect x="18" y="315" width="244" height="110" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="32" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">File Ingestion (I/O)</text>
    <text x="32" y="360" font-family="monospace" font-size="11" font-weight="600" fill="#0f172a">• pd.read_csv('data.csv')</text>
    <text x="32" y="382" font-family="monospace" font-size="11" font-weight="600" fill="#0f172a">• pd.read_excel('file.xlsx')</text>
    <text x="32" y="404" font-family="monospace" font-size="11" font-weight="600" fill="#0f172a">• pd.read_json('feed.json')</text>

    <!-- Key Concept Note -->
    <rect x="18" y="440" width="244" height="62" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="140" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">Key Concept</text>
    <text x="140" y="482" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#334155">Index alignment &amp; schema typing</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="324" y1="370" x2="356" y2="370" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ==================== STAGE 2: MANIPULATION ==================== -->
  <g transform="translate(360, 110)" filter="url(#shadow)">
    <!-- Main Box -->
    <rect width="280" height="520" rx="16" fill="url(#gradStage2)" stroke="#16a34a" stroke-width="2"/>
    <!-- Stage Header Badge -->
    <rect x="20" y="20" width="240" height="42" rx="8" fill="#15803d"/>
    <text x="140" y="46" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">STAGE 2: MANIPULATION</text>

    <!-- Sub-heading -->
    <text x="140" y="88" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#14532d">Transformation &amp; Cleaning</text>

    <!-- Item 1: Inspection & Quality -->
    <rect x="18" y="105" width="244" height="85" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="32" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Inspection &amp; Cleaning</text>
    <text x="32" y="150" font-family="monospace" font-size="11" font-weight="600" fill="#15803d">• df.info(), df.describe()</text>
    <text x="32" y="172" font-family="monospace" font-size="11" font-weight="600" fill="#15803d">• df.dropna(), df.fillna()</text>

    <!-- Item 2: Column Transformations -->
    <rect x="18" y="205" width="244" height="95" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="32" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Feature Engineering</text>
    <text x="32" y="250" font-family="monospace" font-size="11" font-weight="600" fill="#334155">• df['new'] = df['a'] * df['b']</text>
    <text x="32" y="270" font-family="monospace" font-size="11" font-weight="600" fill="#334155">• df.astype(), .to_datetime()</text>
    <text x="32" y="290" font-family="monospace" font-size="11" font-weight="600" fill="#334155">• .apply(lambda), .map()</text>

    <!-- Item 3: Aggregation & Reshaping -->
    <rect x="18" y="315" width="244" height="110" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="32" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Aggregation &amp; Joining</text>
    <text x="32" y="360" font-family="monospace" font-size="11" font-weight="600" fill="#0f172a">• df.groupby('cat').agg(...) </text>
    <text x="32" y="382" font-family="monospace" font-size="11" font-weight="600" fill="#0f172a">• pd.merge(df1, df2, on='id')</text>
    <text x="32" y="404" font-family="monospace" font-size="11" font-weight="600" fill="#0f172a">• pd.concat([df1, df2])</text>

    <!-- Key Concept Note -->
    <rect x="18" y="440" width="244" height="62" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="140" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#14532d">Key Concept</text>
    <text x="140" y="482" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#334155">Vectorized ops &amp; Split-Apply-Combine</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="644" y1="370" x2="676" y2="370" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ==================== STAGE 3: EXTRACTION ==================== -->
  <g transform="translate(680, 110)" filter="url(#shadow)">
    <!-- Main Box -->
    <rect width="280" height="520" rx="16" fill="url(#gradStage3)" stroke="#9333ea" stroke-width="2"/>
    <!-- Stage Header Badge -->
    <rect x="20" y="20" width="240" height="42" rx="8" fill="#7e22ce"/>
    <text x="140" y="46" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">STAGE 3: EXTRACTION</text>

    <!-- Sub-heading -->
    <text x="140" y="88" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#581c87">Querying, Slicing &amp; Export</text>

    <!-- Item 1: Indexing & Slicing -->
    <rect x="18" y="105" width="244" height="85" rx="10" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5"/>
    <text x="32" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Targeted Subsetting</text>
    <text x="32" y="150" font-family="monospace" font-size="11" font-weight="600" fill="#7e22ce">• df.loc[labels, columns]</text>
    <text x="32" y="172" font-family="monospace" font-size="11" font-weight="600" fill="#7e22ce">• df.iloc[row_idx, col_idx]</text>

    <!-- Item 2: Filtering & Query Syntax -->
    <rect x="18" y="205" width="244" height="95" rx="10" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5"/>
    <text x="32" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Conditional Querying</text>
    <text x="32" y="250" font-family="monospace" font-size="11" font-weight="600" fill="#334155">• df[(df['age'] &gt; 25) &amp; (...)]</text>
    <text x="32" y="270" font-family="monospace" font-size="11" font-weight="600" fill="#334155">• df.query('price &gt; 100')</text>
    <text x="32" y="290" font-family="monospace" font-size="11" font-weight="600" fill="#334155">• df.nlargest(5, 'score')</text>

    <!-- Item 3: Export & Serialization -->
    <rect x="18" y="315" width="244" height="110" rx="10" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5"/>
    <text x="32" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Export &amp; Persistence</text>
    <text x="32" y="360" font-family="monospace" font-size="11" font-weight="600" fill="#0f172a">• df.to_csv('res.csv', index=False)</text>
    <text x="32" y="382" font-family="monospace" font-size="11" font-weight="600" fill="#0f172a">• df.to_json('res.json')</text>
    <text x="32" y="404" font-family="monospace" font-size="11" font-weight="600" fill="#0f172a">• df.to_parquet('res.parquet')</text>

    <!-- Key Concept Note -->
    <rect x="18" y="440" width="244" height="62" rx="8" fill="#faf5ff" stroke="#c084fc" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="140" y="462" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#581c87">Key Concept</text>
    <text x="140" y="482" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#334155">Precision slicing &amp; interoperability</text>
  </g>

  <!-- Bottom Summary Bar -->
  <rect x="40" y="642" width="920" height="26" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="500" y="659" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#334155">End-to-End Workflow: Ingest raw tabular data → Clean &amp; enrich schema → Slice, analyze &amp; export clean insights</text>
</svg>

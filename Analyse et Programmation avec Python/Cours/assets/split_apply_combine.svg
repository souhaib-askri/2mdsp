<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%" style="background:transparent;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="440" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0f172a">The Split-Apply-Combine Paradigm in Pandas GroupBy</text>
  <text x="440" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">Partitioning by Keys, Executing Functions on Sub-DataFrames, and Recombining Results</text>

  <!-- Step 1: Original DataFrame (Input) -->
  <g transform="translate(30, 80)">
    <rect width="180" height="230" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    <rect width="180" height="28" rx="6" fill="#3b82f6"/>
    <text x="90" y="19" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">1. Original DataFrame</text>

    <!-- Table content -->
    <rect x="15" y="40" width="150" height="22" fill="#eff6ff"/>
    <text x="50" y="55" font-family="monospace" font-size="10" font-weight="700" fill="#1e3a8a">Key</text>
    <text x="120" y="55" font-family="monospace" font-size="10" font-weight="700" fill="#1e3a8a">Val</text>

    <text x="50" y="80" font-family="monospace" font-size="11" fill="#2563eb">"A"</text> <text x="120" y="80" font-family="monospace" font-size="11" fill="#0f172a">10</text>
    <text x="50" y="105" font-family="monospace" font-size="11" fill="#059669">"B"</text> <text x="120" y="105" font-family="monospace" font-size="11" fill="#0f172a">5</text>
    <text x="50" y="130" font-family="monospace" font-size="11" fill="#2563eb">"A"</text> <text x="120" y="130" font-family="monospace" font-size="11" fill="#0f172a">15</text>
    <text x="50" y="155" font-family="monospace" font-size="11" fill="#d97706">"C"</text> <text x="120" y="155" font-family="monospace" font-size="11" fill="#0f172a">20</text>
    <text x="50" y="180" font-family="monospace" font-size="11" fill="#059669">"B"</text> <text x="120" y="180" font-family="monospace" font-size="11" fill="#0f172a">25</text>

    <rect x="15" y="198" width="150" height="22" rx="4" fill="#f1f5f9"/>
    <text x="90" y="213" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">5 rows total</text>
  </g>

  <!-- Arrow 1: Split -->
  <line x1="215" y1="195" x2="255" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="235" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#3b82f6">SPLIT</text>

  <!-- Step 2: Split into Sub-DataFrames -->
  <g transform="translate(265, 80)">
    <rect width="190" height="310" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="190" height="28" rx="6" fill="#64748b"/>
    <text x="95" y="19" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">2. Sub-DataFrames (sf)</text>

    <!-- Group A -->
    <rect x="15" y="40" width="160" height="65" rx="5" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="25" y="58" font-family="monospace" font-size="10" font-weight="700" fill="#1e3a8a">Group "A":</text>
    <text x="25" y="76" font-family="monospace" font-size="10" fill="#0f172a">Row 0: 10</text>
    <text x="25" y="94" font-family="monospace" font-size="10" fill="#0f172a">Row 2: 15</text>

    <!-- Group B -->
    <rect x="15" y="120" width="160" height="65" rx="5" fill="#f0fdf4" stroke="#10b981"/>
    <text x="25" y="138" font-family="monospace" font-size="10" font-weight="700" fill="#064e3b">Group "B":</text>
    <text x="25" y="156" font-family="monospace" font-size="10" fill="#0f172a">Row 1: 5</text>
    <text x="25" y="174" font-family="monospace" font-size="10" fill="#0f172a">Row 4: 25</text>

    <!-- Group C -->
    <rect x="15" y="200" width="160" height="55" rx="5" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="25" y="218" font-family="monospace" font-size="10" font-weight="700" fill="#78350f">Group "C":</text>
    <text x="25" y="238" font-family="monospace" font-size="10" fill="#0f172a">Row 3: 20</text>

    <text x="95" y="290" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">DataFrameGroupBy Object</text>
  </g>

  <!-- Arrow 2: Apply -->
  <line x1="460" y1="195" x2="500" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="175" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#10b981">APPLY</text>
  <text x="480" y="190" text-anchor="middle" font-family="monospace" font-size="9" fill="#065f46">sum()</text>

  <!-- Step 3: Apply Result per Group -->
  <g transform="translate(510, 80)">
    <rect width="160" height="310" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="160" height="28" rx="6" fill="#10b981"/>
    <text x="80" y="19" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">3. Group Results</text>

    <!-- Calc A -->
    <rect x="15" y="48" width="130" height="48" rx="5" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="80" y="68" text-anchor="middle" font-family="monospace" font-size="10" fill="#1e40af">sum(10, 15)</text>
    <text x="80" y="86" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#1e3a8a">➔ 25</text>

    <!-- Calc B -->
    <rect x="15" y="128" width="130" height="48" rx="5" fill="#f0fdf4" stroke="#10b981"/>
    <text x="80" y="148" text-anchor="middle" font-family="monospace" font-size="10" fill="#065f46">sum(5, 25)</text>
    <text x="80" y="166" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#064e3b">➔ 30</text>

    <!-- Calc C -->
    <rect x="15" y="205" width="130" height="48" rx="5" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="80" y="225" text-anchor="middle" font-family="monospace" font-size="10" fill="#92400e">sum(20)</text>
    <text x="80" y="243" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#78350f">➔ 20</text>
  </g>

  <!-- Arrow 3: Combine -->
  <line x1="675" y1="195" x2="710" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="693" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#7c3aed">COMBINE</text>

  <!-- Step 4: Final Aggregated DataFrame -->
  <g transform="translate(718, 80)">
    <rect width="140" height="230" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
    <rect width="140" height="28" rx="6" fill="#7c3aed"/>
    <text x="70" y="19" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">4. Combined Output</text>

    <!-- Table header -->
    <rect x="10" y="40" width="120" height="22" fill="#faf5ff"/>
    <text x="40" y="55" font-family="monospace" font-size="10" font-weight="700" fill="#6b21a8">Key</text>
    <text x="95" y="55" font-family="monospace" font-size="10" font-weight="700" fill="#6b21a8">Val</text>

    <text x="40" y="85" font-family="monospace" font-size="11" font-weight="700" fill="#2563eb">"A"</text> <text x="95" y="85" font-family="monospace" font-size="11" font-weight="700" fill="#0f172a">25</text>
    <text x="40" y="115" font-family="monospace" font-size="11" font-weight="700" fill="#059669">"B"</text> <text x="95" y="115" font-family="monospace" font-size="11" font-weight="700" fill="#0f172a">30</text>
    <text x="40" y="145" font-family="monospace" font-size="11" font-weight="700" fill="#d97706">"C"</text> <text x="95" y="145" font-family="monospace" font-size="11" font-weight="700" fill="#0f172a">20</text>

    <rect x="10" y="180" width="120" height="35" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
    <text x="70" y="196" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#6b21a8">Index: Key ("A","B","C")</text>
    <text x="70" y="209" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#7e22ce">3 rows (1 per group)</text>
  </g>
</svg>

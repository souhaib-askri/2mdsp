<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="100%" height="100%" style="background:transparent;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="430" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0f172a">The Iterative Data Science Lifecycle</text>
  <text x="430" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">Continuous Feedback and Refinement Loop in Applied Data Science</text>

  <!-- Stage 1 -->
  <g transform="translate(30, 90)">
    <rect width="140" height="150" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="70" cy="30" r="16" fill="#3b82f6"/>
    <text x="70" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">1</text>
    <text x="70" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">Question</text>
    <text x="70" y="88" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">Formulation</text>
    <text x="70" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">Define objectives,</text>
    <text x="70" y="126" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">hypotheses, metrics</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <line x1="170" y1="165" x2="195" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <g transform="translate(200, 90)">
    <rect width="140" height="150" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="70" cy="30" r="16" fill="#10b981"/>
    <text x="70" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">2</text>
    <text x="70" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#064e3b">Data</text>
    <text x="70" y="88" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#064e3b">Acquisition</text>
    <text x="70" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">Extraction, parsing,</text>
    <text x="70" y="126" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">cleaning &amp; merging</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <line x1="340" y1="165" x2="365" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <g transform="translate(370, 90)">
    <rect width="140" height="150" rx="10" fill="#fdf4ff" stroke="#a855f7" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="70" cy="30" r="16" fill="#a855f7"/>
    <text x="70" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">3</text>
    <text x="70" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#581c87">Exploratory</text>
    <text x="70" y="88" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#581c87">Analysis (EDA)</text>
    <text x="70" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">Summary stats,</text>
    <text x="70" y="126" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">distributions, charts</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <line x1="510" y1="165" x2="535" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4 -->
  <g transform="translate(540, 90)">
    <rect width="140" height="150" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="70" cy="30" r="16" fill="#f59e0b"/>
    <text x="70" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">4</text>
    <text x="70" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#78350f">Model &amp;</text>
    <text x="70" y="88" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#78350f">Prediction</text>
    <text x="70" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">Hypothesis testing,</text>
    <text x="70" y="126" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">ML &amp; inference</text>
  </g>

  <!-- Arrow 4 to 5 -->
  <line x1="680" y1="165" x2="705" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 5 -->
  <g transform="translate(710, 90)">
    <rect width="120" height="150" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="60" cy="30" r="16" fill="#ef4444"/>
    <text x="60" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">5</text>
    <text x="60" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#7f1d1d">Decisions</text>
    <text x="60" y="88" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#7f1d1d">&amp; Impact</text>
    <text x="60" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">Reporting, domain</text>
    <text x="60" y="126" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">actionable insight</text>
  </g>

  <!-- Iteration feedback loop arrows below -->
  <path d="M 440 245 C 440 310, 100 310, 100 245" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="270" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">↺ EDA reveals data gaps ➔ Refine Question &amp; Data Acquisition</text>

  <path d="M 770 245 C 770 350, 270 350, 270 245" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="520" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#c2410c">↺ Evaluation &amp; Decision gaps ➔ Re-acquire data or remodel</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="100%" height="100%" style="background:transparent;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="430" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Data Sorting Strategies in Pandas</text>
  <text x="430" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">Direct Column Sort vs Temporary Key Transformation vs Custom Map Ranking</text>

  <!-- Card 1: Direct Column Sorting -->
  <g transform="translate(30, 80)">
    <rect width="250" height="260" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
    <rect width="250" height="32" rx="8" fill="#2563eb"/>
    <text x="125" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Strategy 1: Direct Sort</text>

    <text x="15" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1e40af">Sort by Existing Column</text>
    
    <rect x="15" y="70" width="220" height="45" rx="5" fill="#eff6ff"/>
    <text x="25" y="90" font-family="monospace" font-size="10.5" fill="#1e3a8a">df.sort_values(</text>
    <text x="35" y="106" font-family="monospace" font-size="10.5" fill="#1e3a8a">  by="Count", ascending=False)</text>

    <text x="15" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Mechanics:</text>
    <text x="15" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">• Reorders rows by raw values</text>
    <text x="15" y="171" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">• Original index moves with row</text>
    <text x="15" y="189" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">• Use <tspan font-family="monospace">ignore_index=True</tspan> to reset</text>

    <rect x="15" y="215" width="220" height="30" rx="5" fill="#f1f5f9"/>
    <text x="125" y="234" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#334155">Standard Numerical &amp; Alpha Sort</text>
  </g>

  <!-- Card 2: Key Argument -->
  <g transform="translate(305, 80)">
    <rect width="250" height="260" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <rect width="250" height="32" rx="8" fill="#10b981"/>
    <text x="125" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Strategy 2: Inline Key</text>

    <text x="15" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#065f46">key= Function Argument</text>
    
    <rect x="15" y="70" width="220" height="45" rx="5" fill="#f0fdf4"/>
    <text x="25" y="90" font-family="monospace" font-size="10" fill="#064e3b">df.sort_values("Name",</text>
    <text x="35" y="106" font-family="monospace" font-size="10" fill="#064e3b">  key=lambda x: x.str.len())</text>

    <text x="15" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Mechanics:</text>
    <text x="15" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">• Applies function to Series before sort</text>
    <text x="15" y="171" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">• No persistent extra column created</text>
    <text x="15" y="189" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">• Cleaner and memory efficient</text>

    <rect x="15" y="215" width="220" height="30" rx="5" fill="#ecfdf5"/>
    <text x="125" y="234" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#047857">★ Cleanest for computed sorting</text>
  </g>

  <!-- Card 3: Custom Map Scoring -->
  <g transform="translate(580, 80)">
    <rect width="250" height="260" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
    <rect width="250" height="32" rx="8" fill="#7c3aed"/>
    <text x="125" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Strategy 3: Custom Map</text>

    <text x="15" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#6b21a8">Precomputed Feature Column</text>
    
    <rect x="15" y="70" width="220" height="45" rx="5" fill="#fdf4ff"/>
    <text x="25" y="88" font-family="monospace" font-size="9.5" fill="#581c87">df["score"] = df["Name"].map(fn)</text>
    <text x="25" y="104" font-family="monospace" font-size="9.5" fill="#581c87">df.sort_values(by="score")</text>

    <text x="15" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Mechanics:</text>
    <text x="15" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">• Useful for expensive multi-character logic</text>
    <text x="15" y="171" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">• Feature is preserved for further analysis</text>
    <text x="15" y="189" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">• Can drop column later if needed</text>

    <rect x="15" y="215" width="220" height="30" rx="5" fill="#faf5ff"/>
    <text x="125" y="234" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#6b21a8">Multi-token pattern matching</text>
  </g>
</svg>

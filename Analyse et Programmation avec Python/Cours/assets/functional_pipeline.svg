<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380" width="100%" height="100%" style="background:transparent;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="425" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Functional Programming Triad: Map, Filter, &amp; Reduce</text>
  <text x="425" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">Declarative Data Transformations with First-Class and Anonymous Functions</text>

  <!-- MAP BOX -->
  <g transform="translate(30, 80)">
    <rect width="245" height="260" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    <rect width="245" height="32" rx="8" fill="#3b82f6"/>
    <text x="122" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">map(func, iterable)</text>

    <text x="15" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1e40af">1-to-1 Transformation</text>
    <text x="15" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Applies func to every item</text>

    <!-- Visual schema -->
    <rect x="20" y="95" width="205" height="32" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="122" y="116" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e3a8a">[ 1,   2,   3,   4 ]</text>

    <line x1="122" y1="130" x2="122" y2="155" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="135" y="146" font-family="monospace" font-size="10" fill="#2563eb">x ** 2</text>

    <rect x="20" y="160" width="205" height="32" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="122" y="181" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#1e40af">[ 1,   4,   9,  16 ]</text>

    <text x="15" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Output Shape:</text>
    <text x="15" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Same length N ➔ N</text>
  </g>

  <!-- FILTER BOX -->
  <g transform="translate(302, 80)">
    <rect width="245" height="260" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <rect width="245" height="32" rx="8" fill="#10b981"/>
    <text x="122" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">filter(pred, iterable)</text>

    <text x="15" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#065f46">Selective Subsetting</text>
    <text x="15" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Keeps elements where pred is True</text>

    <!-- Visual schema -->
    <rect x="20" y="95" width="205" height="32" rx="5" fill="#f0fdf4" stroke="#86efac"/>
    <text x="122" y="116" text-anchor="middle" font-family="monospace" font-size="11" fill="#064e3b">[ 1,   2,   3,   4 ]</text>

    <line x1="122" y1="130" x2="122" y2="155" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="135" y="146" font-family="monospace" font-size="10" fill="#059669">x % 2 == 0</text>

    <rect x="20" y="160" width="205" height="32" rx="5" fill="#d1fae5" stroke="#10b981"/>
    <text x="122" y="181" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#065f46">[ 2,   4 ]</text>

    <text x="15" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Output Shape:</text>
    <text x="15" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Reduced length M &lt;= N</text>
  </g>

  <!-- REDUCE BOX -->
  <g transform="translate(575, 80)">
    <rect width="245" height="260" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
    <rect width="245" height="32" rx="8" fill="#f59e0b"/>
    <text x="122" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">reduce(func, iterable)</text>

    <text x="15" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#92400e">Cumulative Folding</text>
    <text x="15" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">from functools import reduce</text>

    <!-- Visual schema -->
    <rect x="20" y="95" width="205" height="32" rx="5" fill="#fffbeb" stroke="#fde68a"/>
    <text x="122" y="116" text-anchor="middle" font-family="monospace" font-size="11" fill="#78350f">[ 1,   2,   3,   4 ]</text>

    <line x1="122" y1="130" x2="122" y2="155" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="135" y="146" font-family="monospace" font-size="10" fill="#b45309">lambda a, b: a+b</text>

    <rect x="20" y="160" width="205" height="32" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="122" y="181" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#92400e">10  (Single Scalar)</text>

    <text x="15" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Output Shape:</text>
    <text x="15" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Aggregated scalar value (1 element)</text>
  </g>
</svg>

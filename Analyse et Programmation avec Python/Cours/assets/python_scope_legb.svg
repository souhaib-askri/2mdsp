<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%" height="100%" style="background:transparent;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="425" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Python Scope Resolution: The LEGB Rule &amp; Traps</text>
  <text x="425" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">Variable Lookup Hierarchy from Inner Functions to Built-in Namespace</text>

  <!-- LEGB Nested Diagram on Left -->
  <g transform="translate(40, 70)">
    <!-- Built-in Scope (Outer) -->
    <rect x="0" y="0" width="420" height="340" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    <text x="20" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e40af">B: Built-in Scope</text>
    <text x="20" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#3b82f6">len, sum, range, print, zip, map, max, ...</text>

    <!-- Global Scope -->
    <rect x="25" y="60" width="370" height="260" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
    <text x="45" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#065f46">G: Global / Module Scope</text>
    <text x="45" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#059669">Variables declared at top-level of module (.py file)</text>

    <!-- Enclosing Scope -->
    <rect x="50" y="120" width="320" height="180" rx="8" fill="#fdf4ff" stroke="#a855f7" stroke-width="2"/>
    <text x="70" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#6b21a8">E: Enclosing (Nonlocal) Scope</text>
    <text x="70" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7c3aed">Names in outer enclosing function (closures)</text>

    <!-- Local Scope -->
    <rect x="75" y="180" width="270" height="100" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="95" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#9a3412">L: Local Scope (Start Here)</text>
    <text x="95" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c2410c">Variables assigned inside the current function/lambda</text>
    <text x="95" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Lookup Direction: L ➔ E ➔ G ➔ B</text>
  </g>

  <!-- Right Side: Common Exam Traps & Rules -->
  <g transform="translate(485, 70)">
    <!-- Card 1: UnboundLocalError Trap -->
    <rect x="0" y="0" width="330" height="160" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="330" height="28" rx="6" fill="#ef4444"/>
    <text x="165" y="19" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Exam Trap: UnboundLocalError</text>
    
    <text x="15" y="50" font-family="monospace" font-size="11" fill="#0f172a">x = 42</text>
    <text x="15" y="68" font-family="monospace" font-size="11" fill="#0f172a">def f():</text>
    <text x="35" y="86" font-family="monospace" font-size="11" fill="#dc2626">    print(x)    # &lt;-- FAILS HERE!</text>
    <text x="35" y="104" font-family="monospace" font-size="11" fill="#0f172a">    x = 7       # Makes 'x' LOCAL</text>
    <text x="15" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">Reason: Assignment <tspan font-family="monospace">x = 7</tspan> marks <tspan font-weight="600">x</tspan> as local</text>
    <text x="15" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">for the entire function before assignment.</text>

    <!-- Card 2: Global Keyword Solution -->
    <rect x="0" y="180" width="330" height="160" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="180" width="330" height="28" rx="6" fill="#059669"/>
    <text x="165" y="199" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Fix: Explicit 'global' Declaration</text>

    <text x="15" y="230" font-family="monospace" font-size="11" fill="#0f172a">x = 1</text>
    <text x="15" y="248" font-family="monospace" font-size="11" fill="#0f172a">def f(a):</text>
    <text x="35" y="266" font-family="monospace" font-size="11" fill="#059669">    global x    # Rebinds to module scope</text>
    <text x="35" y="284" font-family="monospace" font-size="11" fill="#0f172a">    x = x + 1; return a + x</text>
    <text x="15" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">Call 1: <tspan font-family="monospace">f(2) -&gt; 4</tspan> (x becomes 2)</text>
    <text x="15" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">Call 2: <tspan font-family="monospace">f(4) -&gt; 7</tspan> (x becomes 3) | Total = 11</text>
  </g>
</svg>

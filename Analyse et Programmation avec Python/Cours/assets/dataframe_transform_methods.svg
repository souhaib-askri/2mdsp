<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%" style="background:transparent;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="440" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Pandas Transformation Toolkit: Map vs Apply vs Transform vs Pipe</text>
  <text x="440" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">Choosing the Right Method for Row, Column, Dictionary, and Pipeline Operations</text>

  <!-- Grid 2x2 of cards -->

  <!-- Top-Left: Series.map() -->
  <g transform="translate(30, 75)">
    <rect width="395" height="155" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="395" height="28" rx="6" fill="#3b82f6"/>
    <text x="15" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">1. Series.map(dict | func)</text>
    
    <text x="15" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#1e40af">Target: Single Series (Element-wise)</text>
    <text x="15" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">• Fast dictionary lookup: <tspan font-family="monospace">df["grade"].map({"A": 90, "B": 80})</tspan></text>
    <text x="15" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">• Missing dictionary keys become <tspan font-family="monospace" fill="#dc2626">NaN</tspan></text>
    <text x="15" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">• Accepts scalar mapping functions: <tspan font-family="monospace">s.map(lambda x: x*2)</tspan></text>
    <rect x="15" y="118" width="365" height="24" rx="4" fill="#eff6ff"/>
    <text x="25" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#1d4ed8">Best For: Value substitution &amp; dictionary encoding</text>
  </g>

  <!-- Top-Right: DataFrame.apply() -->
  <g transform="translate(455, 75)">
    <rect width="395" height="155" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="395" height="28" rx="6" fill="#10b981"/>
    <text x="15" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">2. DataFrame.apply(func, axis=0 | 1)</text>

    <text x="15" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#065f46">Target: Rows (axis=1) or Columns (axis=0)</text>
    <text x="15" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">• Row-wise cross-column calculations: <tspan font-family="monospace">df.apply(..., axis=1)</tspan></text>
    <text x="15" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">• Can return scalar (reduction) or Series (expansion)</text>
    <text x="15" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">• Slower than vectorization; uses Python loop internally</text>
    <rect x="15" y="118" width="365" height="24" rx="4" fill="#f0fdf4"/>
    <text x="25" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#047857">Best For: Complex multi-column business logic</text>
  </g>

  <!-- Bottom-Left: Series/DF.transform() -->
  <g transform="translate(30, 245)">
    <rect width="395" height="170" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="395" height="28" rx="6" fill="#7c3aed"/>
    <text x="15" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">3. transform(func)</text>

    <text x="15" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#581c87">Guarantees Same Output Shape (Aligned)</text>
    <text x="15" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">• Centering / Standardization: <tspan font-family="monospace">s.transform(lambda x: x - x.mean())</tspan></text>
    <text x="15" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">• Crucial in GroupBy: produces group stats aligned to original rows</text>
    <text x="15" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">• Fails if function tries to aggregate/reduce output length</text>
    <rect x="15" y="125" width="365" height="30" rx="4" fill="#faf5ff"/>
    <text x="25" y="144" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#6b21a8">Best For: Feature scaling, normalization &amp; group broadcast</text>
  </g>

  <!-- Bottom-Right: Specialized Methods (pipe, query, where, mask) -->
  <g transform="translate(455, 245)">
    <rect width="395" height="170" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="395" height="28" rx="6" fill="#d97706"/>
    <text x="15" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">4. Chaining &amp; Conditioning (pipe, query, where, mask)</text>

    <text x="15" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">• <tspan font-weight="700">pipe(fn):</tspan> Composable pipeline step passing full DataFrame</text>
    <text x="15" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">• <tspan font-weight="700">query("str"):</tspan> Filter using readable boolean strings</text>
    <text x="15" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">• <tspan font-weight="700">where(cond, other):</tspan> Keep if True, replace with <tspan font-family="monospace">other</tspan> if False</text>
    <text x="15" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">• <tspan font-weight="700">mask(cond, other):</tspan> Keep if False, replace with <tspan font-family="monospace">other</tspan> if True</text>

    <rect x="15" y="125" width="365" height="30" rx="4" fill="#fffbeb"/>
    <text x="25" y="144" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#b45309">Best For: Method chaining pipelines &amp; element clipping</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 360" width="100%" height="auto" style="background:transparent; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="475" y="40" text-anchor="middle" fill="#000000" font-size="20" font-weight="bold">Text Preprocessing Pipeline in NLP</text>

  <!-- Step 1: Raw Text -->
  <g transform="translate(30, 80)">
    <rect width="180" height="150" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <rect width="180" height="35" rx="10" fill="#f1f5f9"/>
    <text x="90" y="24" text-anchor="middle" fill="#000000" font-size="14" font-weight="bold">1. Raw Text</text>
    <text x="90" y="60" text-anchor="middle" fill="#475569" font-size="12" font-weight="600">Raw Document</text>
    <rect x="15" y="75" width="150" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="25" y="98" fill="#000000" font-size="11" font-weight="500">"This is Andrew's</text>
    <text x="25" y="118" fill="#000000" font-size="11" font-weight="500">text, isn't it?"</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="215" y1="155" x2="260" y2="155" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Tokenization -->
  <g transform="translate(265, 80)">
    <rect width="190" height="150" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect width="190" height="35" rx="10" fill="#dbeafe"/>
    <text x="95" y="24" text-anchor="middle" fill="#000000" font-size="14" font-weight="bold">2. Tokenization</text>
    <text x="95" y="60" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="600">Lexical Splitting</text>
    <rect x="15" y="75" width="160" height="60" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="25" y="98" fill="#000000" font-size="11" font-weight="500">['This', 'is', 'Andrew',</text>
    <text x="25" y="118" fill="#000000" font-size="11" font-weight="500">"'s", 'text', 'is', "n't"]</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="460" y1="155" x2="505" y2="155" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Normalization -->
  <g transform="translate(510, 80)">
    <rect width="200" height="150" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <rect width="200" height="35" rx="10" fill="#ede9fe"/>
    <text x="100" y="24" text-anchor="middle" fill="#000000" font-size="14" font-weight="bold">3. Normalization</text>
    <text x="100" y="60" text-anchor="middle" fill="#6d28d9" font-size="12" font-weight="600">Root &amp; Lemma</text>
    <rect x="15" y="75" width="170" height="60" rx="6" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="25" y="98" fill="#000000" font-size="11" font-weight="600">• Stemming (Porter)</text>
    <text x="25" y="118" fill="#000000" font-size="11" font-weight="600">• Lemmatization (WordNet)</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="715" y1="155" x2="755" y2="155" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 4: Clean Tokens -->
  <g transform="translate(760, 80)">
    <rect width="160" height="150" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <rect width="160" height="35" rx="10" fill="#d1fae5"/>
    <text x="80" y="24" text-anchor="middle" fill="#000000" font-size="14" font-weight="bold">4. Clean Tokens</text>
    <text x="80" y="60" text-anchor="middle" fill="#047857" font-size="12" font-weight="600">Model-Ready Input</text>
    <rect x="12" y="75" width="136" height="60" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="20" y="98" fill="#000000" font-size="11" font-weight="600">Structured feature</text>
    <text x="20" y="118" fill="#000000" font-size="11" font-weight="600">tokens for ML models</text>
  </g>

  <!-- Bottom Legend -->
  <rect x="160" y="280" width="630" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="475" y="310" text-anchor="middle" fill="#000000" font-size="13" font-weight="600">Goal: Minimize vocabulary size, eliminate noise, and isolate meaningful semantics</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="background:transparent;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0f172a">NLTK Tokenizers Comparative Architecture</text>
  <text x="450" y="54" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">Analyzing Sentence Splitting, Contractions, and Punctuation Handling</text>

  <!-- Input Sentence Box -->
  <g transform="translate(150, 75)">
    <rect width="600" height="48" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="20" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Input Text:</text>
    <text x="105" y="29" font-family="monospace" font-size="14" font-weight="600" fill="#0284c7">"This is Andrew's text, isn't it?"</text>
  </g>

  <!-- Connecting Line -->
  <path d="M 450 123 L 450 150" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tokenizer 1: WhitespaceTokenizer -->
  <g transform="translate(30, 160)">
    <rect width="840" height="85" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="220" height="26" rx="6" fill="#fee2e2"/>
    <text x="110" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#991b1b">1. WhitespaceTokenizer</text>

    <!-- Rule -->
    <text x="240" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Rule: Splits strictly on whitespace (\s+)</text>

    <!-- Tokens Output -->
    <g transform="translate(20, 36)">
      <rect x="0" y="0" width="60" height="28" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="30" y="18" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a">'This'</text>
      
      <rect x="70" y="0" width="45" height="28" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="92" y="18" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a">'is'</text>

      <rect x="125" y="0" width="95" height="28" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="172" y="18" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a">"Andrew's"</text>

      <rect x="230" y="0" width="65" height="28" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
      <text x="262" y="18" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#991b1b">'text,'</text>

      <rect x="305" y="0" width="75" height="28" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="342" y="18" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a">"isn't"</text>

      <rect x="390" y="0" width="55" height="28" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
      <text x="417" y="18" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#991b1b">'it?'</text>
    </g>

    <!-- Issue Label -->
    <text x="500" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#dc2626">Issue: Punctuation is stuck to tokens ('text,', 'it?')</text>
  </g>

  <!-- Tokenizer 2: WordPunctTokenizer -->
  <g transform="translate(30, 260)">
    <rect width="840" height="85" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="220" height="26" rx="6" fill="#fef3c7"/>
    <text x="110" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#92400e">2. WordPunctTokenizer</text>

    <!-- Rule -->
    <text x="240" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Rule: Splits into alphanumeric sequences vs non-alphanumeric</text>

    <!-- Tokens Output -->
    <g transform="translate(20, 36)">
      <rect x="0" y="0" width="50" height="28" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="25" y="18" text-anchor="middle" font-family="monospace" font-size="11" fill="#0f172a">'This'</text>
      
      <rect x="58" y="0" width="38" height="28" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="77" y="18" text-anchor="middle" font-family="monospace" font-size="11" fill="#0f172a">'is'</text>

      <rect x="104" y="0" width="68" height="28" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="138" y="18" text-anchor="middle" font-family="monospace" font-size="11" fill="#0f172a">'Andrew'</text>

      <rect x="180" y="0" width="26" height="28" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="193" y="18" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#b45309">"'"</text>

      <rect x="214" y="0" width="26" height="28" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="227" y="18" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#b45309">'s'</text>

      <rect x="248" y="0" width="48" height="28" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="272" y="18" text-anchor="middle" font-family="monospace" font-size="11" fill="#0f172a">'text'</text>

      <rect x="304" y="0" width="26" height="28" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="317" y="18" text-anchor="middle" font-family="monospace" font-size="11" fill="#0f172a">','</text>

      <rect x="338" y="0" width="42" height="28" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="359" y="18" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#b45309">'isn'</text>

      <rect x="388" y="0" width="26" height="28" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="401" y="18" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#b45309">"'"</text>

      <rect x="422" y="0" width="26" height="28" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="435" y="18" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#b45309">'t'</text>

      <rect x="456" y="0" width="32" height="28" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="472" y="18" text-anchor="middle" font-family="monospace" font-size="11" fill="#0f172a">'it'</text>

      <rect x="496" y="0" width="26" height="28" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="509" y="18" text-anchor="middle" font-family="monospace" font-size="11" fill="#0f172a">'?'</text>
    </g>

    <!-- Issue Label -->
    <text x="540" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#d97706">Issue: Produces meaningless fragments ("'", 's', 'isn', 't')</text>
  </g>

  <!-- Tokenizer 3: TreebankWordTokenizer -->
  <g transform="translate(30, 360)">
    <rect width="840" height="95" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="230" height="26" rx="6" fill="#d1fae5"/>
    <text x="115" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#065f46">3. TreebankWordTokenizer (Standard)</text>

    <!-- Rule -->
    <text x="250" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Rule: Penn Treebank grammar rules, splits contractions smartly</text>

    <!-- Tokens Output -->
    <g transform="translate(20, 38)">
      <rect x="0" y="0" width="55" height="28" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="27" y="18" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a">'This'</text>
      
      <rect x="65" y="0" width="40" height="28" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="85" y="18" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a">'is'</text>

      <rect x="115" y="0" width="75" height="28" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="152" y="18" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a">'Andrew'</text>

      <rect x="200" y="0" width="48" height="28" rx="5" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
      <text x="224" y="18" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#065f46">"'s"</text>

      <rect x="258" y="0" width="55" height="28" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="285" y="18" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a">'text'</text>

      <rect x="323" y="0" width="30" height="28" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="338" y="18" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a">','</text>

      <rect x="363" y="0" width="40" height="28" rx="5" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
      <text x="383" y="18" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#065f46">'is'</text>

      <rect x="413" y="0" width="50" height="28" rx="5" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
      <text x="438" y="18" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#065f46">"n't"</text>

      <rect x="473" y="0" width="38" height="28" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="492" y="18" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a">'it'</text>

      <rect x="521" y="0" width="30" height="28" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="536" y="18" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a">'?'</text>
    </g>

    <!-- Success Label -->
    <text x="580" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#059669">&#10004; Ideal: Separates punctuation &amp; correctly isolates "is" + "n't"</text>
  </g>
</svg>

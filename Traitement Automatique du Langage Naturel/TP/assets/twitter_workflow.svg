<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="auto" style="background:transparent; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="460" y="35" text-anchor="middle" fill="#000000" font-size="20" font-weight="bold">Twitter Dataset Preparation &amp; Exploration (Atelier 1 Workflow)</text>

  <!-- Step 1 -->
  <g transform="translate(30, 70)">
    <rect width="190" height="180" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="95" cy="40" r="22" fill="#2563eb"/>
    <text x="95" y="46" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">1</text>
    <text x="95" y="85" text-anchor="middle" fill="#000000" font-size="15" font-weight="bold">Download Corpus</text>
    <text x="95" y="105" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="600">NLTK Datasets</text>
    <line x1="20" y1="120" x2="170" y2="120" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="95" y="145" text-anchor="middle" fill="#000000" font-size="12" font-weight="bold">nltk.download()</text>
    <text x="95" y="165" text-anchor="middle" fill="#475569" font-size="11">twitter_samples</text>
  </g>

  <line x1="225" y1="160" x2="255" y2="160" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g transform="translate(260, 70)">
    <rect width="190" height="180" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <circle cx="95" cy="40" r="22" fill="#059669"/>
    <text x="95" y="46" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">2</text>
    <text x="95" y="85" text-anchor="middle" fill="#000000" font-size="15" font-weight="bold">Extract Strings</text>
    <text x="95" y="105" text-anchor="middle" fill="#047857" font-size="12" font-weight="600">Module Strings API</text>
    <line x1="20" y1="120" x2="170" y2="120" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="95" y="145" text-anchor="middle" fill="#000000" font-size="12" font-weight="bold">5,000 Pos Tweets</text>
    <text x="95" y="165" text-anchor="middle" fill="#000000" font-size="12" font-weight="bold">5,000 Neg Tweets</text>
  </g>

  <line x1="455" y1="160" x2="485" y2="160" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g transform="translate(490, 70)">
    <rect width="190" height="180" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <circle cx="95" cy="40" r="22" fill="#d97706"/>
    <text x="95" y="46" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">3</text>
    <text x="95" y="85" text-anchor="middle" fill="#000000" font-size="15" font-weight="bold">Class Balance</text>
    <text x="95" y="105" text-anchor="middle" fill="#b45309" font-size="12" font-weight="600">Pie Chart (EDA)</text>
    <line x1="20" y1="120" x2="170" y2="120" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="95" y="145" text-anchor="middle" fill="#000000" font-size="12" font-weight="bold">50% Pos / 50% Neg</text>
    <text x="95" y="165" text-anchor="middle" fill="#475569" font-size="11">Matplotlib Pyplot</text>
  </g>

  <line x1="685" y1="160" x2="715" y2="160" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <g transform="translate(720, 70)">
    <rect width="170" height="180" rx="10" fill="#ffffff" stroke="#db2777" stroke-width="2"/>
    <circle cx="85" cy="40" r="22" fill="#db2777"/>
    <text x="85" y="46" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">4</text>
    <text x="85" y="85" text-anchor="middle" fill="#000000" font-size="15" font-weight="bold">Raw Inspection</text>
    <text x="85" y="105" text-anchor="middle" fill="#be185d" font-size="12" font-weight="600">Visual Color Check</text>
    <line x1="15" y1="120" x2="155" y2="120" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="85" y="145" text-anchor="middle" fill="#000000" font-size="12" font-weight="bold">URLs &amp; Emoticons</text>
    <text x="85" y="165" text-anchor="middle" fill="#475569" font-size="11">ANSI Color Output</text>
  </g>

  <rect x="160" y="275" width="600" height="32" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="460" y="296" text-anchor="middle" fill="#000000" font-size="12" font-weight="600">Understanding data distribution accounts for 80% of data science success</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%" style="background:transparent;">
  <defs>
    <filter id="stemShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="stemArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="475" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Stemming Algorithms in NLP: PorterStemmer vs SnowballStemmer</text>
  <text x="475" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#475569">Heuristic Rule-Based Suffix Stripping for Text Normalization</text>

  <!-- Left: PorterStemmer -->
  <g transform="translate(50, 90)">
    <rect x="0" y="0" width="400" height="360" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#stemShadow)"/>
    <rect x="0" y="0" width="400" height="40" rx="8" fill="#dbeafe"/>
    <text x="200" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Porter Stemmer (1980)</text>

    <!-- Info Block -->
    <rect x="20" y="55" width="360" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="32" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0f172a">• Developer: Martin Porter (1980)</text>
    <text x="32" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#334155">• 5 sequential heuristic rule phases</text>
    <text x="32" y="111" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#334155">• Focus: English language historical standard</text>

    <!-- Table of Examples -->
    <text x="20" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Transformation Examples:</text>
    
    <rect x="20" y="160" width="360" height="170" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="20" y1="190" x2="380" y2="190" stroke="#94a3b8" stroke-width="1"/>
    <line x1="200" y1="160" x2="200" y2="330" stroke="#94a3b8" stroke-width="1"/>

    <text x="110" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Input Word</text>
    <text x="290" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e40af">Porter Stem</text>

    <text x="40" y="215" font-family="monospace" font-size="11" fill="#0f172a">pythoning</text>
    <text x="290" y="215" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#1e40af">python</text>

    <text x="40" y="245" font-family="monospace" font-size="11" fill="#0f172a">pythonly</text>
    <text x="290" y="245" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#1e40af">pythonli</text>

    <text x="40" y="275" font-family="monospace" font-size="11" fill="#0f172a">considering</text>
    <text x="290" y="275" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#1e40af">consid</text>

    <text x="40" y="305" font-family="monospace" font-size="11" fill="#0f172a">consequences</text>
    <text x="290" y="305" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#1e40af">consequ</text>

    <text x="200" y="348" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748b">Aggressive rule-based suffix reduction</text>
  </g>

  <!-- Right: SnowballStemmer -->
  <g transform="translate(500, 90)">
    <rect x="0" y="0" width="400" height="360" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#stemShadow)"/>
    <rect x="0" y="0" width="400" height="40" rx="8" fill="#d1fae5"/>
    <text x="200" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#065f46">Snowball Stemmer (Porter2 - 2001)</text>

    <!-- Info Block -->
    <rect x="20" y="55" width="360" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="32" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0f172a">• Developer: Martin Porter (Improved &amp; Faster)</text>
    <text x="32" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#334155">• Multilingual support (English, French, Arabic, etc.)</text>
    <text x="32" y="111" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#334155">• Handles irregular endings &amp; special suffixes</text>

    <!-- Table of Examples -->
    <text x="20" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Transformation Examples:</text>
    
    <rect x="20" y="160" width="360" height="170" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="20" y1="190" x2="380" y2="190" stroke="#94a3b8" stroke-width="1"/>
    <line x1="200" y1="160" x2="200" y2="330" stroke="#94a3b8" stroke-width="1"/>

    <text x="110" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Input Word</text>
    <text x="290" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#065f46">Snowball Stem</text>

    <text x="40" y="215" font-family="monospace" font-size="11" fill="#0f172a">pythoning</text>
    <text x="290" y="215" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#065f46">python</text>

    <text x="40" y="245" font-family="monospace" font-size="11" fill="#0f172a">pythonly</text>
    <text x="290" y="245" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#065f46">python</text>

    <text x="40" y="275" font-family="monospace" font-size="11" fill="#0f172a">considering</text>
    <text x="290" y="275" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#065f46">consid</text>

    <text x="40" y="305" font-family="monospace" font-size="11" fill="#0f172a">consequences</text>
    <text x="290" y="305" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#065f46">consequ</text>

    <text x="200" y="348" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#059669">Refined rules preventing false stems (e.g. pythonly -> python)</text>
  </g>
</svg>
